      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;       // un temps
          const E = B / 2;          // une croche
          const S = B / 4;          // une double croche
          const END = 4.571;
          const T1 = 3 * E;         // 35,143 : Club sportif
          const T2 = 6 * E;         // 36,0   : 100 à 249
          const T3 = 9 * E;         // 36,857 : Continuer
          const TY = 21 * S;        // 37,286 : début de la frappe
          const ZOOM = 14 * E;      // 38,286 : traversée dans le bouton jaune

          // Points de l'écran (pixels d'écran) amenés au centre du cadre
          const F = (fx, fy) => ({ x: 390 - fx, y: 960 - fy });
          const SCA = 420, SCB = 700;              // défilement de l'étape 1 : vers la quantité, puis vers « Continuer »
          const CLUB = [147, 744], Q100 = [133, 1435], NEXT = [390, 1971];
          // Bouton « Envoyer ma demande » : 287 à 748 x 1321 à 1417, texte de 371 à 664 (mesuré).
          // SENDY vise le jaune à droite du texte : la traversée remplit le cadre de jaune, sans lettres géantes.
          const MAIL = [236, 1107], SEND = [540, 1369], SENDY = [710, 1369];

          // ---------- Fond ----------
          tl.fromTo("#s08-r1", { x: -120 }, { x: -620, duration: END, ease: "none" }, 0);
          tl.fromTo("#s08-r2", { x: -900 }, { x: -400, duration: END, ease: "none" }, 0);
          tl.fromTo("#s08-r3", { x: -260 }, { x: -760, duration: END, ease: "none" }, 0);
          tl.set("#s08-deep", { opacity: 1 }, 10 * E);

          // Formes : éclat depuis le centre, puis dérive lente jusqu'à la fin
          const C = [540, 960];
          function burst(list, start, step, dur, ease, s0) {
            list.forEach(([id, ex, ey, r0, r1, dx, dy, r2], i) => {
              const t0 = start + i * step;
              tl.fromTo(id, { x: C[0] - ex, y: C[1] - ey, scale: s0, rotation: r0 },
                { x: 0, y: 0, scale: 1, rotation: r1, duration: dur, ease: ease }, t0);
              tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t0);
              tl.to(id, { x: dx, y: dy, rotation: r2, duration: END - t0 - dur, ease: "none" }, t0 + dur);
            });
          }
          burst([["#s08-d1", 92, 330, -40, 150, -26, -20, 230], ["#s08-d2", 940, 420, 0, 0, 24, -22, 0],
            ["#s08-d3", 960, 1080, 30, 140, 22, 24, 220], ["#s08-d4", 80, 1180, 0, 0, -18, 20, 0],
            ["#s08-d5", 880, 1640, 40, -18, 26, 14, -50], ["#s08-d6", 120, 1660, 0, 0, -20, 18, 0]], 0.04, 0.035, 0.7, "power3.out", 0.25);
          // Second éclat, plus sec, sur le fond foncé (37,143)
          burst([["#s08-d7", 880, 610, -30, 135, 16, 14, 200], ["#s08-d8", 1000, 780, 0, 0, 12, -16, 0],
            ["#s08-d9", 950, 1330, 40, 160, 14, -18, 230], ["#s08-d10", 760, 140, -40, 20, 18, 10, 50]], 10 * E, 0.025, 0.45, "power4.out", 0.3);

          // ---------- Caméra ----------
          // Plan incliné vu de haut : arrivée sur la relance, lente dérive, plan large au passage à l'étape 2,
          // gros plan sur l'e-mail, glissé jusqu'au bouton jaune puis traversée
          tl.fromTo("#s08-plane",
            { y: 1500, rotationX: 62, rotationZ: -28, scale: 1.1, transformPerspective: 2000 },
            { y: 0, rotationX: 46, rotationZ: -17, scale: 1.75, duration: 0.8, ease: "power3.out" }, 0);
          tl.to("#s08-plane", { rotationX: 42, rotationZ: -14, scale: 1.88, duration: T3 + 0.03 - 0.8, ease: "none" }, 0.8);
          tl.to("#s08-plane", { rotationX: 34, rotationZ: -10, scale: 0.98, duration: 10 * E - T3 - 0.03, ease: "power3.out" }, T3 + 0.03);
          tl.to("#s08-plane", { rotationX: 40, rotationZ: -14, scale: 1.95, duration: 0.28, ease: "power3.out" }, 10 * E);
          tl.to("#s08-plane", { rotationX: 38, rotationZ: -12, scale: 2.05, duration: 13 * E - 10 * E - 0.28, ease: "none" }, 10 * E + 0.28);
          tl.to("#s08-plane", { rotationX: 32, rotationZ: -9, scale: 2.4, duration: ZOOM - 13 * E, ease: "power2.inOut" }, 13 * E);
          tl.to("#s08-plane", { rotationX: 22, rotationZ: -5, duration: END - ZOOM, ease: "power2.in" }, ZOOM);

          tl.fromTo("#s08-phone", F(360, 560), { ...F(CLUB[0] + 100, CLUB[1] - 20), duration: 0.8, ease: "power3.out" }, 0);
          tl.to("#s08-phone", { ...F(CLUB[0] + 88, CLUB[1] + 4), duration: 0.15, ease: "none" }, 0.8);
          tl.to("#s08-phone", { ...F(Q100[0] + 90, Q100[1] - SCA - 24), duration: 0.7, ease: "power2.inOut" }, 0.95);
          tl.to("#s08-phone", { ...F(Q100[0] + 76, Q100[1] - SCA + 4), duration: 0.25, ease: "none" }, 1.65);
          tl.to("#s08-phone", { ...F(NEXT[0], NEXT[1] - SCB), duration: 0.55, ease: "power3.inOut" }, 1.9);
          tl.to("#s08-phone", { ...F(NEXT[0], NEXT[1] - SCB + 8), duration: T3 + 0.03 - 2.45, ease: "none" }, 2.45);
          tl.to("#s08-phone", { ...F(390, 640), duration: 10 * E - T3 - 0.03, ease: "power3.out" }, T3 + 0.03);
          tl.to("#s08-phone", { ...F(MAIL[0], MAIL[1]), duration: 0.28, ease: "power3.out" }, 10 * E);
          tl.to("#s08-phone", { ...F(MAIL[0] + 50, MAIL[1] + 6), duration: 13 * E - 10 * E - 0.28, ease: "none" }, 10 * E + 0.28);
          tl.to("#s08-phone", { ...F(SEND[0], SEND[1]), duration: ZOOM - 13 * E, ease: "power2.inOut" }, 13 * E);
          // Sur le temps, la caméra file à droite du texte, dans le jaune, avant que le zoom n'accélère
          tl.to("#s08-phone", { ...F(SENDY[0], SENDY[1]), duration: 0.34, ease: "power2.out" }, ZOOM);

          // Punch-in sec sur le temps fort de la mesure, tenu jusqu'au tap sur « Continuer »
          tl.fromTo("#s08-cam", { scale: 1 }, { scale: 1.1, duration: 0.07, ease: "power4.out" }, 4 * B);
          tl.to("#s08-cam", { scale: 1.05, duration: 0.2, ease: "power2.out" }, 4 * B + 0.07);
          tl.to("#s08-cam", { scale: 1, duration: 0.25, ease: "power3.out" }, T3 + 0.03);
          // Traversée : zoom plat qui accélère, la coupe tombe en plein jaune sur la relance
          tl.to("#s08-cam", { scale: 14, duration: END - ZOOM, ease: "power3.in" }, ZOOM);
          tl.fromTo("#s08-ylw", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, END - 0.13);

          // Défilement de l'étape 1 jusqu'au bouton « Continuer »
          tl.fromTo("#s08-scroll", { y: 0 }, { y: -SCA, duration: 0.7, ease: "power2.inOut" }, 0.95);
          tl.to("#s08-scroll", { y: -SCB, duration: 0.5, ease: "power3.inOut" }, 1.9);

          // ---------- Outils ----------
          // ringFade : durée d'extinction de l'onde (plus courte quand la page change sous le doigt)
          function tap(n, t, hold, fade, ringFade) {
            const d = "#s08-tap" + n + "-dot", r = "#s08-tap" + n + "-ring";
            const h = hold === undefined ? 0.22 : hold;
            tl.fromTo(d, { scale: 0.6 }, { scale: 1.5, duration: 0.11, ease: "power3.out" }, t - 0.12);
            tl.to(d, { scale: 1.25, duration: 0.06, ease: "power2.out" }, t);
            tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, t - 0.12);
            tl.to(d, { opacity: 0, duration: fade || 0.16, ease: "power2.in" }, t + h);
            tl.fromTo(r, { scale: 0.8 }, { scale: 3.4, duration: 0.5, ease: "power2.out" }, t);
            tl.fromTo(r, { opacity: 0 }, { opacity: 0.95, duration: 0.03, ease: "none" }, t - 0.03);
            tl.to(r, { opacity: 0, duration: ringFade || 0.5, ease: "power2.out" }, t);
          }
          function press(sel, t) {
            tl.to(sel, { scale: 0.95, duration: 0.07, ease: "power2.out" }, t);
            tl.to(sel, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.07);
          }
          function pop(sel, t, st) {
            tl.fromTo(sel, { y: 8 }, { y: 0, duration: 0.4, ease: "power3.out", stagger: st || 0 }, t);
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out", stagger: st || 0 }, t);
          }
          function grow(sel, t) {
            tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, t);
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
          }
          function select(sel, t) {
            tl.fromTo(sel, { backgroundColor: "#FFFFFF", borderColor: "#8A7E88", color: "#1A1320" },
              { backgroundColor: "#B3125F", borderColor: "#B3125F", color: "#FFFFFF", duration: 0.1, ease: "power2.out" }, t);
          }

          // ---------- Étape 1 : l'interface se construit sur les croches ----------
          tl.fromTo("#s08-barfill", { scaleX: 0 }, { scaleX: 0.5, duration: 0.5, ease: "power3.out" }, 0.05);
          pop(["#s08-h1a", "#s08-h1b"], 0, 0.06);
          pop(["#s08-in1", "#s08-req1"], E, 0.06);
          pop(["#s08-l1", ".s08-k1"], 2 * E, 0.04);
          pop(["#s08-g2", "#s08-l3", ".s08-k3"], 4 * E, 0.035);
          pop(["#s08-l4", ".s08-k4"], 5 * E, 0.035);
          grow("#s08-next", 6 * E);
          pop("#s08-reas", 7 * E);

          // 35,143 : « Club sportif »
          tap(1, T1);
          press("#s08-c-club", T1);
          select("#s08-c-club", T1 + 0.03);

          // 36,0 : quantité « 100 à 249 »
          tap(2, T2);
          press("#s08-c-100", T2);
          select("#s08-c-100", T2 + 0.03);

          // 36,857 : « Continuer », la barre passe à l'étape 2.
          // La page change sous le doigt (T3 + 0,06) : le point est éteint à ce moment-là et l'onde s'efface
          // en 0,2 s, pour que rien ne flotte sur le champ e-mail de l'étape 2.
          tap(3, T3, 0, 0.06, 0.2);
          press("#s08-next", T3);
          tl.to("#s08-barfill", { scaleX: 1, duration: 0.4, ease: "power3.out" }, T3 + 0.06);
          tl.to("#s08-st1", { opacity: 0, duration: 0.08, ease: "power2.out" }, T3 + 0.06);
          tl.fromTo("#s08-st2", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, T3 + 0.1);
          tl.fromTo("#s08-st2", { y: 6 }, { y: 0, duration: 0.3, ease: "power3.out" }, T3 + 0.1);
          // Changement d'étape franc, comme sur le site : la page 2 remplace la page 1 et repart en haut
          tl.set("#s08-p1", { opacity: 0 }, T3 + 0.06);
          tl.set("#s08-p2", { opacity: 1 }, T3 + 0.06);

          // ---------- Étape 2 : vos coordonnées ----------
          pop(".s08-k5", T3 + 0.06, 0.04);
          pop("#s08-legal", 11 * E);
          pop("#s08-back", 11 * E);
          grow("#s08-send", 11 * E + 0.04);

          // Champ e-mail actif, puis frappe sur les doubles croches : contact@votreclub.fr
          tl.fromTo("#s08-email", { borderColor: "#8A7E88" }, { borderColor: "#B3125F", duration: 0.1, ease: "power2.out" }, 10 * E + 0.08);
          tl.set("#s08-ty0", { opacity: 1 }, 10 * E + 0.08);
          for (let k = 1; k <= 5; k++) {
            tl.set("#s08-ty" + (k - 1), { opacity: 0 }, TY + (k - 1) * S);
            tl.set("#s08-ty" + k, { opacity: 1 }, TY + (k - 1) * S);
          }
          // Curseur : clignote une fois la frappe finie
          [[TY + 4 * S + 0.24, 0], [TY + 4 * S + 0.4, 1], [TY + 4 * S + 0.6, 0], [TY + 4 * S + 0.76, 1]].forEach(([t, o]) =>
            tl.set(".s08-caret", { opacity: o }, t));

          window.__timelines["s08"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
