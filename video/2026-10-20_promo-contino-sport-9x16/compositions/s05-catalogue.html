      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;          // un temps
          const E = B / 2;             // une croche
          const END = 4.572;
          const TAP = 6 * B;           // 24,0 s : tap sur le set football
          const ZOOM = TAP + E;        // départ de la traversée
          const SCROLL0 = 4600;        // défilement de départ, en px d'interface
          const BRAKE = 800;           // distance du freinage
          const T_BRAKE = 1.9;         // début du freinage

          // Mots géants : vitesse constante, sens alternés
          tl.fromTo("#s05-row1", { x: -260 }, { x: -760, duration: END, ease: "none" }, 0);
          tl.fromTo("#s05-row2", { x: -1500 }, { x: -1000, duration: END, ease: "none" }, 0);
          tl.fromTo("#s05-row3", { x: -520 }, { x: -1020, duration: END, ease: "none" }, 0);

          // Éclat de formes depuis le centre sur le départ du groove, puis dérive lente
          const C = [540, 960];
          const decos = [
            ["#s05-d1", 930, 250, -30, 150, -20, -24, 210],
            ["#s05-d2", 960, 520, 0, 0, 26, -18, 0],
            ["#s05-d3", 820, 160, 20, 135, 18, 20, 225],
            ["#s05-d4", 60, 160, 0, 0, -16, 22, 0],
            ["#s05-d5", 640, 640, -40, -20, 30, 10, -8],
            ["#s05-d6", 40, 760, 30, -150, -10, -26, -200],
          ];
          decos.forEach(([id, ex, ey, r0, r1, dx, dy, r2], i) => {
            const t0 = 0.04 + i * 0.035;
            tl.fromTo(id, { x: C[0] - ex, y: C[1] - ey, scale: 0.2, rotation: r0 },
              { x: 0, y: 0, scale: 1, rotation: r1, duration: 0.7, ease: "power3.out" }, t0);
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, t0);
            tl.to(id, { x: dx, y: dy, rotation: r2, duration: END - t0 - 0.7, ease: "none" }, t0 + 0.7);
          });

          // Écran couché en très gros plan, lente dérive, puis il se redresse pendant le freinage
          tl.fromTo("#s05-phone",
            { x: 70, y: 420, rotationX: 52, rotationZ: -12, scale: 1.5, transformPerspective: 2000 },
            { x: 50, y: 400, rotationZ: -10, scale: 1.52, duration: 4.5 * B, ease: "none" }, 0);
          tl.to("#s05-phone", { x: 0, y: 0, rotationX: 12, rotationZ: -5, scale: 1.22, duration: 0.8, ease: "power3.inOut" }, 4.5 * B);
          tl.to("#s05-phone", { rotationZ: -4, scale: 1.25, duration: ZOOM - (4.5 * B + 0.8), ease: "none" }, 4.5 * B + 0.8);

          // La grille défile vite à vitesse constante, puis freine jusqu'au set football
          // (vitesse raccordée : 3 x BRAKE / 1,2 s = (SCROLL0 - BRAKE) / T_BRAKE)
          tl.fromTo("#s05-page", { y: -SCROLL0 }, { y: -BRAKE, duration: T_BRAKE, ease: "none" }, 0);
          tl.to("#s05-page", { y: 0, duration: 1.2, ease: "power3.out" }, T_BRAKE);

          // Gros texte révélé par masque, une ligne par croche
          function inn(sel, t) { tl.fromTo(sel, { yPercent: 130 }, { yPercent: 0, duration: 0.42, ease: "power3.out" }, t); }
          function out(sel, t) { tl.to(sel, { yPercent: -140, duration: 0.2, ease: "power2.in" }, t); }
          // Chaque groupe n'est visible que pendant sa fenêtre (le masque cache le reste)
          tl.fromTo("#s05-g1", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, E);
          tl.set("#s05-g1", { opacity: 0 }, 4 * E + 0.3);

          inn("#s05-n1", E); inn("#s05-w1", 2 * E);
          out("#s05-n1", 4 * E); out("#s05-w1", 4 * E + 0.04);
          inn("#s05-n2", 5 * E); inn("#s05-w2", 6 * E);
          out("#s05-n2", 9 * E); out("#s05-w2", 9 * E + 0.04);

          // Impact sur le départ du groove B : le cadre arrive serré et se détend
          tl.fromTo("#s05-cam", { scale: 1.08 }, { scale: 1, duration: 0.34, ease: "power3.out" }, 0);
          // Punch-in sur le premier temps de la seconde mesure, puis lente poussée
          tl.to("#s05-cam", { scale: 1.06, duration: 0.1, ease: "power4.out" }, 4 * B);
          tl.to("#s05-cam", { scale: 1.09, duration: ZOOM - (4 * B + 0.1), ease: "none" }, 4 * B + 0.1);

          // Tap sur le set football à 24,0 s
          tl.fromTo("#s05-tap-dot", { scale: 0.5 }, { scale: 1, duration: 0.1, ease: "power3.out" }, TAP - 0.05);
          tl.fromTo("#s05-tap-dot", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, TAP - 0.05);
          tl.to("#s05-tap-dot", { opacity: 0, duration: 0.16, ease: "power2.in" }, TAP + 0.24);
          tl.fromTo("#s05-tap-ring", { scale: 0.6 }, { scale: 2.6, duration: 0.5, ease: "power2.out", immediateRender: false }, TAP);
          tl.fromTo("#s05-tap-ring", { opacity: 0.95 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, TAP);
          tl.fromTo("#s05-card1", { scale: 1 }, { scale: 0.95, duration: 0.07, ease: "power2.out" }, TAP);
          tl.to("#s05-card1", { scale: 1, duration: 0.22, ease: "power2.out" }, TAP + 0.07);
          tl.fromTo("#s05-card1-sel", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, TAP);
          tl.fromTo("#s05-card1-name", { color: "#1A1320" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, TAP);

          // Les catégories lointaines sont passées : on les retire une fois hors champ
          tl.set("#s05-far", { opacity: 0 }, 5.5 * B);

          // Traversée dans la carte : la coupe tombe au zoom maximal
          tl.to("#s05-cam", { scale: 11, duration: END - ZOOM, ease: "power3.in" }, ZOOM);

          window.__timelines["s05"] = tl;
        })();
      </script>
