      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;               // un temps
          const E = B / 2;                  // une croche
          const M = 4 * B;                  // une mesure
          // La scène commence à 11,429 alors que le temps 20 du film tombe à 11,4286 : les repères sont pris sur la
          // grille du film (temps k = k × B), avec une milliseconde d'avance pour que l'image du temps porte l'événement
          // (sinon 12,0, 14,0, 16,0 et 18,0 glissent d'une image : à 16,0 l'écran Running se posait sur le fond bleu).
          const G = (k) => k * B - 11.429 - 0.001;
          const BARS = [G(20), G(24), G(28), G(32)]; // une mesure par sport
          const STOP = 20.0 - 11.429;       // 8,571 : arrêt musical, tout se fige
          const PUSH = 0.43;                // poussée verticale, milieu sur le temps
          const SLAM = 0.25;                // relance après la coupure : arrivée sèche sur le temps
          const C = [540, 900];             // centre de l'écran dans le cadre
          const COLORS = ["#B3125F", "#1F4FD1", "#138A4B", "#1A1320"];

          // ---------- Fond qui claque sur les temps forts, mots géants ----------
          BARS.forEach((b, i) => {
            if (i > 0) {
              tl.set("#s04-bg", { backgroundColor: COLORS[i] }, b);
              tl.set("#s04-w" + i, { opacity: 0 }, b);
              tl.set("#s04-w" + (i + 1), { opacity: 1 }, b);
            }
            const t0 = i === 0 ? 0 : b - PUSH / 2;
            const t1 = i === 3 ? STOP : b + M;
            const w = "#s04-w" + (i + 1);
            const dir = i % 2 ? -1 : 1;
            tl.fromTo(w + "-r1", { x: -200 - 180 * (1 - dir) }, { x: -200 - 180 * (1 + dir), duration: t1 - t0, ease: "none" }, t0);
            tl.fromTo(w + "-r2", { x: -740 - 180 * (1 + dir) }, { x: -740 - 180 * (1 - dir), duration: t1 - t0, ease: "none" }, t0);
            tl.fromTo(w + "-r3", { x: -380 - 180 * (1 - dir) }, { x: -380 - 180 * (1 + dir), duration: t1 - t0, ease: "none" }, t0);
          });

          // ---------- Formes : éclat depuis le centre à chaque départ de sport ----------
          // [x, y, rotation départ, rotation arrivée, dérive x, dérive y, rotation finale]
          const DECO = [
            [[110, 360, -60, 150, -20, -26, 230], [930, 330, 0, 0, 24, -20, 0], [120, 1250, 0, 135, -16, 28, 200], [920, 1640, 40, -30, 22, 18, -50], [160, 1700, 0, 0, -18, 20, 0]],
            [[140, 330, 0, 0, -22, -18, 0], [920, 560, 40, -160, 22, -24, -230], [950, 1180, 0, 0, 20, 16, 0], [130, 1580, 0, 135, -18, 24, 210], [880, 1700, -40, 25, 20, 16, 45]],
            [[930, 300, 0, 135, 20, -22, 220], [150, 250, 0, 0, -18, -14, 0], [120, 700, 60, 150, -20, -16, 230], [150, 1300, 0, 0, -20, 22, 0], [900, 1620, 40, -20, 22, 20, -40]],
            [[930, 420, 0, 0, 16, -14, 0], [130, 560, -40, 140, -14, -12, 190], [940, 1250, 0, 135, 14, 16, 180], [140, 1300, 0, 0, -12, 14, 0], [880, 1680, -30, 30, 14, 12, 50]],
          ];
          DECO.forEach((set, i) => {
            const b = BARS[i];
            const end = i === 3 ? STOP : BARS[i + 1] - PUSH / 2;
            set.forEach(([ex, ey, r0, r1, dx, dy, r2], k) => {
              const id = "#s04-d" + (i + 1) + "-" + (k + 1);
              const t0 = b + 0.02 + k * 0.035;
              tl.fromTo(id, { x: C[0] - ex, y: C[1] - ey, scale: 0.3, rotation: r0 },
                { x: 0, y: 0, scale: 1.3, rotation: r1, duration: 0.7, ease: "power3.out" }, t0);
              tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, t0);
              tl.to(id, { x: dx, y: dy, rotation: r2, duration: end - t0 - 0.7, ease: "none" }, t0 + 0.7);
              if (i < 3) tl.to(id, { opacity: 0, duration: 0.18, ease: "power2.in" }, end - 0.05);
            });
          });

          // ---------- Caméra ----------
          // Ouverture : on sort de la photo du set football (raccord avec la traversée de la scène 3)
          tl.fromTo("#s04-cam", { scale: 5.5, y: 288 }, { scale: 1, y: 0, duration: 0.66, ease: "power4.out" }, 0);
          // Relance après la coupure (16,0 s) : punch-in sec, puis relâche
          tl.to("#s04-cam", { scale: 1.07, duration: 0.09, ease: "power4.out" }, BARS[2]);
          tl.to("#s04-cam", { scale: 1, duration: 1.5, ease: "sine.inOut" }, BARS[2] + 0.2);
          // Supporters : lente poussée qui s'arrête net à l'arrêt musical
          tl.to("#s04-cam", { scale: 1.04, duration: STOP - BARS[3], ease: "none" }, BARS[3]);

          // ---------- Écrans : poussée verticale d'une mesure à l'autre ----------
          const inStart = [0, BARS[1] - PUSH / 2, BARS[2] - SLAM, BARS[3] - PUSH / 2];
          const outStart = [BARS[1] - PUSH / 2, BARS[2] - SLAM, BARS[3] - PUSH / 2, null];
          const moveDur = (t) => (t === BARS[2] - SLAM ? SLAM : PUSH);
          const moveEase = (t) => (t === BARS[2] - SLAM ? "power2.in" : "power3.inOut");
          for (let i = 0; i < 4; i++) {
            const u = "#s04-u" + (i + 1);
            if (i === 0) tl.to(u, { y: -1920, duration: PUSH, ease: "power3.inOut" }, outStart[0]);
            else {
              tl.fromTo(u, { y: 1920 }, { y: 0, duration: moveDur(inStart[i]), ease: moveEase(inStart[i]) }, inStart[i]);
              if (outStart[i] !== null) tl.to(u, { y: -1920, duration: moveDur(outStart[i]), ease: moveEase(outStart[i]) }, outStart[i]);
            }
            // Légère dérive en profondeur, l'écran reste de face
            const d0 = inStart[i];
            const d1 = outStart[i] === null ? STOP : outStart[i] + moveDur(outStart[i]);
            // L'écran reste de face mais tourne et avance un peu pendant la mesure (départ du sport 1 identique
            // à la fin de la scène 3 : échelle 0,74, aucune rotation)
            const s = i % 2 ? -1 : 1;
            tl.fromTo("#s04-dr" + (i + 1),
              { scale: 0.74, rotationY: i === 0 ? 0 : -8 * s, rotationX: i === 0 ? 0 : 5, rotation: i === 0 ? 0 : -1.2 * s, transformPerspective: 2000 },
              { scale: 0.77, rotationY: 8 * s, rotationX: 1, rotation: 1 * s, duration: d1 - d0, ease: "none" }, d0);
          }

          // ---------- Interface qui se construit sur les croches, étiquette de prix ----------
          // Photo, vignettes et bouton arrivent avec l'écran (pas d'écran vide pendant la poussée) ;
          // titre, prix, pastilles puis étiquette claquent sur les croches qui suivent l'arrivée.
          function pop(sel, t) {
            tl.fromTo(sel, { y: 14 }, { y: 0, duration: 0.4, ease: "power3.out" }, t);
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
          }
          BARS.forEach((b, i) => {
            const n = i + 1;
            pop("#s04-ti" + n, b + E);
            if (n !== 4) pop("#s04-me" + n, b + E + 0.07);
            pop("#s04-pr" + n, b + 2 * E);
            if (n === 2 || n === 4) pop("#s04-ch" + n, b + 3 * E);
            const left = n % 2 === 0;
            const tagIn = b + 4 * E;
            tl.fromTo("#s04-tag" + n, { scale: 0.5, rotation: left ? 14 : -14, y: 40 },
              { scale: 1, rotation: left ? 4 : -4, y: 0, duration: 0.45, ease: "back.out(1.7)" }, tagIn);
            tl.fromTo("#s04-tag" + n, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, tagIn);
            // L'étiquette flotte jusqu'au départ de l'écran (ou jusqu'à l'arrêt musical)
            const tagEnd = outStart[i] === null ? STOP : outStart[i];
            tl.to("#s04-tag" + n, { rotation: left ? 1.5 : -1.5, y: -14, duration: tagEnd - tagIn - 0.45, ease: "sine.inOut" }, tagIn + 0.45);
            // Coup sur la caisse claire du 4e temps : l'étiquette repique entre son arrivée et la poussée suivante
            // (sauf Supporters, dont le 4e temps est l'arrêt musical de 20,0)
            if (n < 4) tl.to("#s04-tag" + n, { keyframes: [{ scale: 1.06, duration: 0.05, ease: "power2.out" }, { scale: 1, duration: 0.3, ease: "power3.out" }] }, b + 3 * B);
          });

          window.__timelines["s04"] = tl;
        })();
      </script>
