<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/kit.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #B3125F; }
        #s02-cam { position: absolute; inset: 0; transform-origin: 540px 870px; }
        .s02-row { position: absolute; left: 0; white-space: nowrap; font: 900 330px/1 var(--head); font-stretch: 78%; text-transform: uppercase; letter-spacing: -.01em; }
        .s02-row.f { color: #A11057; }
        .s02-row.o { color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.2); }
        #s02-r1 { top: 170px; }
        #s02-r2 { top: 1200px; }
        #s02-r3 { top: 1540px; }
        #s02-logo { position: absolute; left: 190px; top: 560px; width: 700px; height: 297px; transform-origin: 50% 55%; }
        #s02-logo img { display: block; width: 700px; height: 297px; }
        #s02-line { position: absolute; left: 330px; top: 905px; width: 420px; height: 16px; border-radius: 8px; background: var(--yellow); transform-origin: 50% 50%; }
        #s02-tag { position: absolute; left: 64px; right: 64px; top: 975px; text-align: center; }
        #s02-tag .mask { padding-top: 4px; margin-top: -4px; padding-bottom: 8px; margin-bottom: -8px; }
        #s02-tag span { font: 800 66px/1.1 var(--head); font-stretch: 85%; color: #FFFFFF; }
        .deco.tri.s02-w { border-bottom-color: #FFFFFF; }
        .deco.ring.s02-w { border-color: #FFFFFF; }
        .deco.dot.s02-w { background: #FFFFFF; }
        .deco.plus.s02-w::before, .deco.plus.s02-w::after { background: #FFFFFF; }
      </style>
      <div id="root" data-composition-id="s02" data-width="1080" data-height="1920">
        <div id="s02-cam" data-layout-allow-overflow>
          <div class="s02-row f" id="s02-r1" data-layout-allow-overflow aria-hidden="true" data-layout-ignore>SUBLIMATION SUBLIMATION SUBLIMATION</div>
          <div class="s02-row o" id="s02-r2" data-layout-allow-overflow aria-hidden="true" data-layout-ignore>CLUBS ENTREPRISES CLUBS ENTREPRISES</div>
          <div class="s02-row f" id="s02-r3" data-layout-allow-overflow aria-hidden="true" data-layout-ignore>CONTINO SPORT CONTINO SPORT</div>

          <div class="deco tri s02-deco" id="s02-d1" style="left:130px;top:400px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco ring s02-w s02-deco" id="s02-d2" style="left:900px;top:370px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco plus s02-deco" id="s02-d3" style="left:960px;top:690px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco dot s02-w s02-deco" id="s02-d4" style="left:110px;top:1250px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco bar s02-deco" id="s02-d5" style="left:760px;top:1290px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco tri s02-w s02-deco" id="s02-d6" style="left:420px;top:1300px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco ring s02-deco" id="s02-d7" style="left:70px;top:720px" data-layout-allow-overflow data-layout-ignore></div>
          <div class="deco plus s02-w s02-deco" id="s02-d8" style="left:620px;top:420px" data-layout-allow-overflow data-layout-ignore></div>

          <div id="s02-logo"><img src="assets/logo-blanc.png" alt="Contino Sport" /></div>
          <div id="s02-line"></div>
          <div id="s02-tag">
            <div class="mask"><span id="s02-t1" data-layout-allow-overflow>Sublimation textile</span></div>
            <div class="mask"><span id="s02-t2" data-layout-allow-overflow>pour clubs et entreprises</span></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105, E = B / 2, D = 2.286;

          // Mots géants en fond : rangées en sens contraires, vitesse constante
          tl.fromTo(".s02-row", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0);
          tl.fromTo("#s02-r1", { x: -80 }, { x: -420, duration: D, ease: "none" }, 0);
          tl.fromTo("#s02-r2", { x: -1500 }, { x: -1160, duration: D, ease: "none" }, 0);
          tl.fromTo("#s02-r3", { x: -300 }, { x: -640, duration: D, ease: "none" }, 0);

          // Logo blanc qui arrive sur le départ
          tl.fromTo("#s02-logo", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0);
          // (de plus haut et un peu plus long : la fin du claquement se lit encore quand le flash blanc de l'hôte s'efface)
          tl.fromTo("#s02-logo", { scale: 1.5 }, { scale: 1, duration: 0.5, ease: "power4.out" }, 0);

          // Souligné jaune qui grandit depuis son centre
          tl.fromTo("#s02-line", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, E);

          // Phrase révélée par masque, une ligne par croche
          tl.fromTo("#s02-t1", { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 2 * E);
          tl.fromTo("#s02-t2", { yPercent: 105 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 3 * E);

          // Éclat de formes depuis le centre sur le départ, puis dérive lente
          const cx = 540, cy = 860;
          // [id, x, y, échelle, rotation, symétrique] : anneaux et points dérivent, les autres tournent sur place
          const decos = [
            ["#s02-d1", 130, 400, 1.8, -20, false],
            ["#s02-d2", 900, 370, 1.5, 0, true],
            ["#s02-d3", 960, 690, 1.5, 20, false],
            ["#s02-d4", 110, 1250, 1.8, 0, true],
            ["#s02-d5", 760, 1290, 1.5, -18, false],
            ["#s02-d6", 420, 1300, 1.4, 25, false],
            ["#s02-d7", 70, 720, 1.2, 0, true],
            ["#s02-d8", 620, 420, 1.2, -15, false],
          ];
          decos.forEach(([id, x, y, s, r0, sym], i) => {
            const t0 = 0.02 * i, d = D - 0.6 - t0;
            if (sym) {
              tl.fromTo(id, { x: cx - x, y: cy - y, scale: 0 }, { x: 0, y: 0, scale: s, duration: 0.6, ease: "power3.out" }, t0);
              tl.to(id, { x: (x < cx ? -22 : 22), y: (y < cy ? -26 : 26), duration: d, ease: "none" }, 0.6 + t0);
            } else {
              tl.fromTo(id, { x: cx - x, y: cy - y, scale: 0, rotation: r0 - 120 }, { x: 0, y: 0, scale: s, rotation: r0, duration: 0.6, ease: "power3.out" }, t0);
              tl.to(id, { rotation: r0 + (i % 2 ? 40 : -40), duration: d, ease: "none" }, 0.6 + t0);
            }
            // Petit coup d'échelle sur l'accord et le charleston ouvert de 6,0 (croche 5), décalé d'une forme à l'autre
            tl.to(id, { keyframes: [{ scale: s * 1.3, duration: 0.05, ease: "power2.out" }, { scale: s, duration: 0.28, ease: "power3.out" }] }, 5 * E + 0.015 * i);
          });

          // Punch-in sec sur le temps, puis poussée qui accélère : la coupe tombe sur la relance à pleine échelle
          tl.fromTo("#s02-cam", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power4.out" }, 2 * B);
          tl.to("#s02-cam", { scale: 1.3, duration: D - 3 * B, ease: "power3.in" }, 3 * B);

          window.__timelines["s02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
