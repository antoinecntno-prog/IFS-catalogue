              <div id="s03-page" data-layout-allow-overflow>

                  <p id="s03-lead">Votre logo et vos couleurs sur tout l'équipement de votre club ou de votre entreprise. Vous validez la maquette avant la production, réalisée en Europe.</p>
                  <div id="s03-cta-wrap"><div class="ui-btn y" id="s03-cta">Recevoir mon devis</div></div>

                  </div>

                    <defs>
                      <clipPath id="s03-kclip"><path d="M165 26C180 44 220 44 235 26L292 44 372 104 340 164 302 142 304 420Q200 432 96 420L98 142 60 164 28 104 108 44Z" /></clipPath>
                      <linearGradient id="s03-kshade" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#3A041E" stop-opacity=".16" /><stop offset=".3" stop-color="#3A041E" stop-opacity="0" />

                      <path stroke="#1A1320" d="M165 26C180 50 220 50 235 26" stroke-width="10" fill="none" />
                      <circle stroke="#1A1320" cx="258" cy="116" r="21" stroke-width="2" stroke-dasharray="4 4" fill="none" />
                      <text fill="#1A1320" x="258" y="120" text-anchor="middle" style="font: 800 10px/1 'Hanken Grotesk', Arial, sans-serif; letter-spacing: .08em">LOGO</text>

                <div class="ui-search s03-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#1A1320" stroke-width="2.2" /><path d="M16 16l5 5" stroke="#1A1320" stroke-width="2.2" stroke-linecap="round" /></svg>Rechercher</div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;          // un temps
          const E = B / 2;             // une croche
          const Q = B / 4;             // une double croche
          const END = 4.572;

          // Géométrie : écran de face, centre (540, 960), échelle 0,8 ; vignette « Maillots & shorts »
          // au centre (72, 1327) de la page en px d'interface, page défilée de SCROLL.
          const SCROLL = 857;
          const TX = 343.2, TY = 1036.8; // centre de la vignette dans le cadre (origine de la caméra)

          // Mots géants : vitesse constante, sens alternés
          tl.fromTo("#s03-row1", { x: -150 }, { x: -650, duration: END, ease: "none" }, 0);
          tl.fromTo("#s03-row2", { x: -1450 }, { x: -950, duration: END, ease: "none" }, 0);
          tl.fromTo("#s03-row3", { x: -480 }, { x: -980, duration: END, ease: "none" }, 0);

          // Éclat de formes depuis le centre, puis dérive lente
          const C = [540, 960];
          const decos = [
            ["#s03-d1", 120, 380, -40, 160, -24, -30, 250],
            ["#s03-d2", 930, 250, 0, 0, 30, -26, 0],
            ["#s03-d3", 960, 1790, 30, 135, 20, 24, 225],
            ["#s03-d4", 60, 1180, 60, -28, -18, 22, -12],
            ["#s03-d5", 190, 1760, 0, 0, -26, 18, 0],
            ["#s03-d6", 70, 740, 0, 0, -22, -14, 0],
            ["#s03-d7", 620, 1810, 20, -150, 16, 26, -230],
            ["#s03-d8", 1000, 600, 0, 90, 24, -10, 180],
          ];
          decos.forEach(([id, ex, ey, r0, r1, dx, dy, r2], i) => {
            const t0 = 0.08 + i * 0.03;
            tl.fromTo(id, { x: C[0] - ex, y: C[1] - ey, scale: 0.3, rotation: r0 },
              { x: 0, y: 0, scale: 1.5, rotation: r1, duration: 0.75, ease: "power3.out" }, t0);
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, t0);
            tl.to(id, { x: dx, y: dy, rotation: r2, duration: END - t0 - 0.75, ease: "none" }, t0 + 0.75);
          });

          // L'écran monte couché puis se redresse
          tl.fromTo("#s03-phone",
            { y: 1150, rotationX: 58, rotationZ: -22, scale: 0.78, transformPerspective: 2000 },
            { y: 0, rotationX: 14, rotationZ: -6, scale: 0.8, duration: 5 * E, ease: "power3.out" }, 0);
          tl.to("#s03-phone", { rotationX: 0, rotationZ: 0, duration: 5 * E, ease: "power2.inOut" }, 5 * E);

          // Construction du bandeau sur les croches
          function pop(sel, t, dy) {
            tl.fromTo(sel, { y: dy || 16 }, { y: 0, duration: 0.4, ease: "power3.out" }, t);
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
          }
          pop("#s03-h1", E); pop("#s03-h2", E + 0.07);
          pop("#s03-h3", 2 * E); pop("#s03-h4", 2 * E + 0.07);
          pop("#s03-lead", 3 * E);
          // Bouton qui jaillit de son centre, sans écraser son texte
          tl.fromTo("#s03-cta", { scale: 0.3 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 4 * E);
          tl.fromTo("#s03-cta", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 4 * E);
          pop("#s03-price", 4 * E + 0.07);
          pop("#s03-facts", 4 * E + 0.14);

          // La page défile jusqu'aux catégories
          tl.fromTo("#s03-page", { y: 0 }, { y: -SCROLL, duration: 5 * E, ease: "power3.inOut" }, 4.5 * E);
          tl.set("#s03-hero-top", { opacity: 0 }, 2.15); // sortie de l'écran par le haut
          pop("#s03-cats-h", 6 * E);
          [1, 2, 3, 4].forEach((n, i) => pop("#s03-tile" + n, 7 * E + i * Q, 20));

          // Punch-in sur le temps, puis lente poussée vers la vignette
          tl.fromTo("#s03-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.07, duration: 0.09, ease: "power4.out" }, 5 * B);
          tl.to("#s03-cam", { scale: 1.2, x: 60, y: -24, duration: 6.5 * B - 5 * B - 0.09, ease: "none" }, 5 * B + 0.09);

          // Tap sur « Maillots & shorts » à 10,29 s (temps local 6 temps)
          const TAP = 6 * B;
          // Point agrandi (environ 90 px à l'écran) pour rester lisible sur l'écran réduit
          tl.fromTo("#s03-tap-dot", { scale: 0.6 }, { scale: 1.4, duration: 0.1, ease: "power3.out" }, TAP - 0.05);
          tl.fromTo("#s03-tap-dot", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, TAP - 0.05);
          tl.to("#s03-tap-dot", { opacity: 0, duration: 0.16, ease: "power2.in" }, TAP + 0.24);
          tl.fromTo("#s03-tap-ring", { scale: 0.9 }, { scale: 3.4, duration: 0.5, ease: "power2.out" }, TAP);
          tl.fromTo("#s03-tap-ring", { opacity: 0 }, { opacity: 0.95, duration: 0.03, ease: "none" }, TAP - 0.03);
          tl.to("#s03-tap-ring", { opacity: 0, duration: 0.5, ease: "power2.out" }, TAP);
          tl.to("#s03-tile1", { scale: 0.95, duration: 0.07, ease: "power2.out" }, TAP);
          tl.to("#s03-tile1", { scale: 1, duration: 0.22, ease: "power2.out" }, TAP + 0.07);
          tl.to("#s03-tile1-name", { color: "#B3125F", duration: 0.1, ease: "power2.out" }, TAP);
          tl.fromTo("#s03-tile1-sel", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, TAP);
          tl.to("#s03-tile1-sel", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.5 * B + 0.1);

          // Traversée dans la vignette : la coupe tombe au zoom maximal
          tl.to("#s03-cam", { scale: 18, x: 540 - TX, y: 960 - TY, duration: END - 6.5 * B, ease: "power3.in" }, 6.5 * B);

          window.__timelines["s03"] = tl;
        })();
      </script>
    </template>
