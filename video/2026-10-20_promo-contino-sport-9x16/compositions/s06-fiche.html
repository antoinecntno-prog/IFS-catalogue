      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;          // un temps
          const E = B / 2;             // une croche
          const END = 4.571;
          const STEP = [1.5 * B, 2.5 * B, 3.5 * B]; // 26,0 / 26,57 / 27,14 s : 30, 50 puis 100 pcs
          const CUT = 5 * B;           // 28,0 s : coupe en macro
          const TAP = 6.5 * B;         // 28,857 s : tap sur « Personnaliser ce produit » (sur la croche, avec l'accord)
          const ZOOM = 7 * B;          // départ de la traversée, une croche après le tap comme en scène 5
          const GLIDE = 692;           // défilement maximal : le bas de la fiche touche le bas de l'écran
          const COL = 52.8;            // largeur d'une colonne de palier
          const PHONE_Y = 330;         // hauteur de l'écran une fois la grille atteinte

          // Mots géants : vitesse constante, sens alternés
          tl.fromTo("#s06-row1", { x: -300 }, { x: -800, duration: CUT, ease: "none" }, 0);
          tl.fromTo("#s06-row2", { x: -1500 }, { x: -1000, duration: CUT, ease: "none" }, 0);
          tl.fromTo("#s06-row3", { x: -600 }, { x: -1100, duration: CUT, ease: "none" }, 0);

          // Éclat de formes depuis le centre au départ de la section
          const C = [540, 960];
          const decos = [
            ["#s06-d1", 90, 290, 0, 0, -18, 20, 0],
            ["#s06-d2", 250, 170, 30, 120, 20, -16, 200],
            ["#s06-d3", 120, 520, -40, 160, -14, -22, 220],
            ["#s06-d4", 300, 380, 0, 0, 22, 14, 0],
            ["#s06-d5", 960, 150, 40, -20, 24, 10, -6],
          ];
          decos.forEach(([id, ex, ey, r0, r1, dx, dy, r2], i) => {
            const t0 = 0.06 + i * 0.035;
            tl.fromTo(id, { x: C[0] - ex, y: C[1] - ey, scale: 0.2, rotation: r0 },
              { x: 0, y: 0, scale: 1, rotation: r1, duration: 0.7, ease: "power3.out" }, t0);
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, t0);
            tl.to(id, { x: dx, y: dy, rotation: r2, duration: CUT - t0 - 0.7, ease: "none" }, t0 + 0.7);
          });

          // Fiche couchée en perspective. La caméra glisse jusqu'à la grille de prix : la page défile
          // et l'écran remonte en même temps, pour que la grille arrive au milieu du cadre (zone sûre).
          const G = STEP[0] - 0.02;
          tl.fromTo("#s06-phone",
            { x: -10, y: 610, rotationX: 56, rotationZ: 15, scale: 1.72, transformPerspective: 2000 },
            { x: 10, y: PHONE_Y, rotationZ: 14, scale: 1.74, duration: G, ease: "power3.inOut" }, 0);
          tl.to("#s06-phone", { x: -16, y: PHONE_Y - 24, rotationZ: 12.5, scale: 1.8, duration: CUT - G, ease: "none" }, G);
          tl.fromTo("#s06-page", { y: 0 }, { y: -GLIDE, duration: G, ease: "power3.inOut" }, 0);
          // Le haut de la fiche se fond dans le fond quand le gros texte arrive
          tl.fromTo("#s06-scrim", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0.32);

          // Punch-in d'ouverture sur la relance
          tl.fromTo("#s06-cam", { scale: 1 }, { scale: 1.05, duration: 0.1, ease: "power4.out" }, 0);
          tl.to("#s06-cam", { scale: 1, duration: 4 * B - 0.1, ease: "none" }, 0.1);
          // Punch-in sur le premier temps de la seconde mesure, puis lente poussée
          tl.to("#s06-cam", { scale: 1.05, duration: 0.1, ease: "power4.out" }, 4 * B);
          tl.to("#s06-cam", { scale: 1.065, duration: CUT - 4 * B - 0.1, ease: "none" }, 4 * B + 0.1);

          // La surbrillance avance d'un palier par temps : 30, 50 puis 100 pcs
          tl.fromTo("#s06-hl", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, STEP[0]);
          tl.fromTo("#s06-hl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, STEP[0]);
          tl.fromTo("#s06-hl", { x: 0 }, { x: COL, duration: 0.26, ease: "power3.out" }, STEP[1]);
          tl.to("#s06-hl", { x: 2 * COL, duration: 0.26, ease: "power3.out" }, STEP[2]);
          // À chaque palier, la case s'étire un instant dans le sens du pas puis se pose
          [STEP[1], STEP[2]].forEach((t) => {
            tl.to("#s06-hl", { keyframes: [
              { scaleX: 1.16, scaleY: 1.05, duration: 0.08, ease: "power2.out" },
              { scaleX: 1, scaleY: 1, duration: 0.24, ease: "back.out(2.2)" },
            ] }, t);
          });
          tl.fromTo("#s06-h1", { color: "#5E5360" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, STEP[0]);
          tl.to("#s06-h1", { color: "#5E5360", duration: 0.1, ease: "power2.out" }, STEP[1]);
          tl.fromTo("#s06-h2", { color: "#5E5360" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, STEP[1]);
          tl.to("#s06-h2", { color: "#5E5360", duration: 0.1, ease: "power2.out" }, STEP[2]);
          tl.fromTo("#s06-h3", { color: "#5E5360" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, STEP[2]);
          tl.fromTo(["#s06-a2", "#s06-b2"], { color: "#1A1320" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, STEP[1]);
          tl.to(["#s06-a2", "#s06-b2"], { color: "#1A1320", duration: 0.1, ease: "power2.out" }, STEP[2]);
          tl.fromTo(["#s06-a3", "#s06-b3"], { color: "#1A1320" }, { color: "#B3125F", duration: 0.1, ease: "power2.out" }, STEP[2]);

          // Gros texte : surtitre puis palier qui roule à chaque pas
          tl.fromTo("#s06-kick", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2 * E);
          tl.fromTo("#s06-n1", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, STEP[0]);
          // Le palier sortant s'éteint dès que ses chiffres ont passé le masque : sinon le jambage du « p »
          // reste seul sous « Palier atteint » pendant 0,2 s, comme un tiret égaré
          tl.set("#s06-n1", { opacity: 0 }, STEP[1] + 0.12);
          tl.fromTo("#s06-n2", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, STEP[1]);
          tl.set("#s06-n2", { opacity: 0 }, STEP[2] + 0.12);
          tl.fromTo("#s06-n3", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, STEP[2]);
          tl.fromTo("#s06-kick", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 2 * E);
          tl.fromTo("#s06-n1", { yPercent: 105 }, { yPercent: 0, duration: 0.36, ease: "power3.out" }, STEP[0]);
          // Compteur : sortant et entrant roulent ensemble, même durée et même ease
          tl.to("#s06-n1", { yPercent: -105, duration: 0.32, ease: "power3.out" }, STEP[1]);
          tl.fromTo("#s06-n2", { yPercent: 105 }, { yPercent: 0, duration: 0.32, ease: "power3.out" }, STEP[1]);
          tl.to("#s06-n2", { yPercent: -105, duration: 0.32, ease: "power3.out" }, STEP[2]);
          tl.fromTo("#s06-n3", { yPercent: 105 }, { yPercent: 0, duration: 0.32, ease: "power3.out" }, STEP[2]);
          // Le palier où elle s'arrête : souligné jaune qui se trace
          tl.fromTo("#s06-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, STEP[2] + E / 2);

          // Coupe franche en macro sur le bouton
          tl.set("#s06-main", { opacity: 0 }, CUT);
          tl.set("#s06-macro", { opacity: 1 }, CUT);
          // L'écran arrive encore en mouvement (plus incliné, décalé) et se pose en 0,6 s, puis glisse
          tl.fromTo("#s06-mphone",
            { x: 230, y: 330, rotationX: 44, rotationZ: -20, scale: 3.15, transformPerspective: 2000 },
            { x: 10, y: 254, rotationX: 31, rotationZ: -13, scale: 2.86, duration: 0.6, ease: "power3.out" }, CUT);
          tl.to("#s06-mphone", { x: -40, y: 250, rotationX: 30, rotationZ: -12, scale: 2.9, duration: END - CUT - 0.6, ease: "none" }, CUT + 0.6);
          // Punch-in sur le temps suivant, poussée lente vers le bouton
          tl.fromTo("#s06-mcam", { scale: 1 }, { scale: 1.06, duration: 0.1, ease: "power4.out" }, CUT + B);
          tl.to("#s06-mcam", { scale: 1.09, duration: ZOOM - (CUT + B + 0.1), ease: "none" }, CUT + B + 0.1);

          // Tap à 28,857 s : le bouton s'enfonce et passe en encre
          tl.fromTo("#s06-mtap-dot", { scale: 0.5 }, { scale: 1, duration: 0.1, ease: "power3.out" }, TAP - 0.05);
          tl.fromTo("#s06-mtap-dot", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, TAP - 0.05);
          tl.to("#s06-mtap-dot", { opacity: 0, duration: 0.14, ease: "power2.in" }, TAP + 0.18);
          tl.fromTo("#s06-mtap-ring", { scale: 0.6 }, { scale: 2.6, duration: 0.45, ease: "power2.out", immediateRender: false }, TAP);
          tl.fromTo("#s06-mtap-ring", { opacity: 0.95 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, TAP);
