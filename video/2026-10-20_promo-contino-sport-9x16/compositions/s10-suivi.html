      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 105;           // un temps
          const E = B / 2;              // une croche
          const T = [1, 4, 7, 10, 13].map((k) => k * B); // 41,714 / 43,429 / 45,143 / 46,857 / 48,571 s
          const MONTEE = 8 * B;         // 45,714 s : la caméra accélère et pousse
          const SIL = 15.5 * B;         // 50,0 s : silence, traversée
          const END = 16 * B;           // 50,286 s : flash blanc de l'hôte

          // Géométrie (px d'interface sauf mention) : chaque étape mesure 148 px ; la visée se fait
          // au milieu de la ligne active, à 235 px du haut de l'écran.
          const ROW = 148, V = ROW / (3 * B);  // vitesse de défilement : une étape toutes les trois temps
          const AIM = [540, 880];              // point de visée dans le cadre (origine des rotations)
          const PH = [176, 410];               // coin de l'écran dans le cadre
          const S5 = -V * T[4];                // défilement quand l'étape 5 est visée
          const SEND = S5 - V * (SIL - T[4]) / 2; // fin du défilement (décélération sans à-coup)
          const DOT5 = [35, 262 + 4 * ROW];    // centre du rond de l'étape 5 dans la page

          // Mots géants : dérive lente pendant la pause, puis ils accélèrent avec la montée
          [["#s10-r1", -200, -560, -1320], ["#s10-r2", -1500, -1140, -380], ["#s10-r3", -500, -860, -1620]].forEach(([id, a, b, c]) => {
            tl.fromTo(id, { x: a }, { x: b, duration: MONTEE, ease: "none" }, 0);
            tl.to(id, { x: c, duration: END - MONTEE, ease: "power2.in" }, MONTEE);
          });

          // Halo magenta : il naît au début de la montée et envahit le haut du cadre jusqu'au silence
          tl.fromTo("#s10-glow", { scale: 0.55 }, { scale: 1.35, duration: SIL - MONTEE, ease: "power2.in" }, MONTEE);
          tl.fromTo("#s10-glow", { opacity: 0 }, { opacity: 1, duration: SIL - MONTEE, ease: "power1.in" }, MONTEE);

          // Formes : deux éclats depuis le centre, au départ de la pause puis au départ de la montée
          const C = [540, 760];
          const decos = [
            // [id, x, y, rotation finale, dérive x, dérive y, rotation de dérive, départ]
            ["#s10-d1", 120, 250, -20, -18, -14, 60, 0],
            ["#s10-d2", 880, 236, 0, 20, -16, 0, 0],
            ["#s10-d3", 470, 226, 20, -10, -18, 110, 0],
            ["#s10-d4", 330, 380, 0, -16, 10, 0, 0],
            ["#s10-d5", 660, 330, -14, 18, 8, 30, 0],
            ["#s10-d6", 70, 430, 0, -14, 12, 0, MONTEE],
            ["#s10-d7", 760, 190, 15, 14, -12, -70, MONTEE],
            ["#s10-d8", 980, 400, 0, 16, 10, 0, MONTEE],
          ];
          decos.forEach(([id, x, y, r1, dx, dy, r2, t], i) => {
            const t0 = t + 0.04 + (i % 5) * 0.035;
            tl.fromTo(id, { x: C[0] - x, y: C[1] - y, scale: 0.2, rotation: r1 - 120 },
              { x: 0, y: 0, scale: 1, rotation: r1, duration: 0.7, ease: "power3.out" }, t0);
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, t0);
            tl.to(id, { x: dx, y: dy, rotation: r1 + r2, duration: SIL - t0 - 0.7, ease: "none" }, t0 + 0.7);
          });

          // Écran couché en perspective : il se redresse un peu à l'ouverture, dérive, puis la caméra pousse
          tl.fromTo("#s10-tilt",
            { rotationX: 54, rotationZ: -12, scale: 1.24, transformPerspective: 2400 },
            { rotationX: 42, rotationZ: -9, scale: 1.32, transformPerspective: 2400, duration: 1.4, ease: "power3.out" }, 0);
          tl.to("#s10-tilt", { rotationZ: -8, scale: 1.36, duration: MONTEE - 1.4, ease: "none" }, 1.4);
          const FIN = { rx: 34, rz: -5, s: 1.72, d: 2400 };
          tl.to("#s10-tilt", { rotationX: FIN.rx, rotationZ: FIN.rz, scale: FIN.s, duration: SIL - MONTEE, ease: "power2.in" }, MONTEE);

          // La caméra descend le long de la frise : défilement régulier, une étape toutes les trois temps
          tl.fromTo("#s10-page", { y: 0 }, { y: S5, duration: T[4], ease: "none" }, 0);
          tl.to("#s10-page", { y: SEND, duration: SIL - T[4], ease: "power2.out" }, T[4]);

          // Les étapes s'allument
          const GREY = "#8A7E88", INK = "#1A1320", LAB = "#6B606C", MAG = "#B3125F";
          T.forEach((t, i) => {
            const k = i + 1;
            if (k > 1) {
              // le trait de progression descend jusqu'au rond suivant
              tl.fromTo("#s10-tr" + (k - 1), { scaleY: 0 }, { scaleY: 1, duration: T[i] - T[i - 1] - 0.24, ease: "none" }, T[i - 1] + 0.22);
            }
            tl.fromTo("#s10-on" + k, { scale: 0.3 }, { scale: 1, duration: 0.36, ease: "back.out(2)" }, t);
            tl.fromTo("#s10-on" + k, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, t);
            tl.fromTo("#s10-n" + k, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power2.out" }, t);
            tl.fromTo("#s10-ck" + k, { strokeDashoffset: 26 }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, t + 0.08);
            tl.fromTo("#s10-pu" + k, { scale: 1 }, { scale: 2.4, duration: 0.6, ease: "power2.out" }, t);
            tl.fromTo("#s10-pu" + k, { opacity: 0.9 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, t);
            tl.fromTo("#s10-t" + k, { color: GREY }, { color: INK, duration: 0.12, ease: "power2.out" }, t);
            tl.fromTo("#s10-lb" + k, { color: LAB }, { color: MAG, duration: 0.12, ease: "power2.out" }, t);
            // punch-in sec sur le temps, puis la caméra revient
            const p = k >= 4 ? 1.06 : 1.04;
            if (k === 1) tl.fromTo("#s10-cam", { scale: 1 }, { scale: p, duration: 0.08, ease: "power4.out" }, t);
            else tl.to("#s10-cam", { scale: p, duration: 0.08, ease: "power4.out" }, t);
            tl.to("#s10-cam", { scale: 1, duration: 0.9, ease: "power2.inOut" }, t + 0.08);
          });
          // La surbrillance suit l'étape active
          tl.fromTo("#s10-hl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, T[0]);
          tl.fromTo("#s10-hl", { scaleX: 0.9 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, T[0]);
          tl.fromTo("#s10-hl", { y: 0 }, { y: ROW, duration: 0.34, ease: "power3.out" }, T[1]);
          for (let i = 2; i < 5; i++) tl.to("#s10-hl", { y: i * ROW, duration: 0.34, ease: "power3.out" }, T[i]);

          // Ce qui a défilé s'efface avant d'atteindre le bord haut de l'écran : aucune ligne n'est tranchée par le bord.
          // Une étape passée s'efface ligne par ligne (étiquette, titre, phrase) dès que l'étape suivante s'allume :
          // l'étiquette touche le bord vers T + 0,41 s, le titre vers T + 0,6 s.
          tl.fromTo("#s10-head > *", { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out" }, 0.06);
          tl.fromTo("#s10-intro > *", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out" }, 0.7);
          for (let k = 1; k <= 4; k++) {
            tl.fromTo("#s10-x" + k + " > *", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none", stagger: 0.1 }, T[k] + 0.06);
          }

          // La carte de la commande attend sous la frise ; à la livraison elle claque et passe au magenta
          tl.fromTo("#s10-order", { scale: 1 }, { scale: 1.07, duration: 0.09, ease: "power3.out" }, T[4] + E);
          tl.to("#s10-order", { scale: 1, duration: 0.36, ease: "back.out(2.2)" }, T[4] + E + 0.09);
          tl.fromTo("#s10-order", { borderColor: "#E7E0E5" }, { borderColor: "#B3125F", duration: 0.12, ease: "power2.out" }, T[4] + E);

          // Traversée dans le rond de l'étape 5 : position projetée du rond à la fin de la poussée
          // (ordre GSAP : échelle, rotationX, rotation, puis perspective autour de l'origine)
          function project(px, py, st) {
            const dx = (px - AIM[0]) * st.s, dy = (py - AIM[1]) * st.s;
            const rx = st.rx * Math.PI / 180, rz = st.rz * Math.PI / 180;
            const y1 = dy * Math.cos(rx), z1 = dy * Math.sin(rx);
            const x2 = dx * Math.cos(rz) - y1 * Math.sin(rz), y2 = dx * Math.sin(rz) + y1 * Math.cos(rz);
            const f = st.d / (st.d - z1);
            return [AIM[0] + f * x2, AIM[1] + f * y2];
          }
          const pc = project(PH[0] + 2 * DOT5[0], PH[1] + 2 * (DOT5[1] - 5 + SEND), FIN);
          // Travelling latéral lent pendant la descente, puis traversée
