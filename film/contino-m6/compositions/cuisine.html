  <script>
    const C = 10.55;
    // Bande oblique relevée sur Apple (outils-calage/formes.py) : 36 points par clé, de 11,0 à 13,0 s.
    const M = window.MASQUES.cuisine;
    const BANDE = calque.piste(M.T.map((t) => t - C), M.P);
    // Le capot balaie l'objectif de gauche à droite (Apple : 180 à 1420 px à 10,75 s, 680 à 1500 px à 11,0 s),

      [-1400, 470, 2.3, 28, -6, 30],
      [800, 500, 2.1, 30, -6, 16],

      [1540, 760, 0.72, 60, 18, 0],
      [1600, 770, 0.62, 60, 20, 0],
    ]);
    const tl = gsap.timeline({ paused: true });
    calque.piloter(tl, 0, 2.55, (t) => {
      gsap.set("#cui-masque", { clipPath: calque.polygone(BANDE(t)) });
      const [x, y, s, ry, rz, f] = CAPOT(t);
      gsap.set("#cui-capot", {
        x: x - 342, y: y - 240, scale: s, rotationY: ry, rotation: rz,
        transformPerspective: 1600, filter: `blur(${Math.max(0, f).toFixed(1)}px)`,

    });
    window.__timelines["cuisine"] = tl;
