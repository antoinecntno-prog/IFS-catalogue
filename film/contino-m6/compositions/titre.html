<template>
  <style>

    #tit-catalogue {

  </style>
  <div id="root" data-composition-id="titre" data-width="1920" data-height="1080">

      <span class="tit-mot" id="tit-nouveau">NOUVEAU</span>
      <span class="tit-mot" id="tit-catalogue">CATALOGUE</span>
      <span class="tit-mot" id="tit-edition">ÉDITION</span>
      <span class="tit-mot" id="tit-annee"><span id="tit-c1">2</span><span id="tit-c2">0</span><span id="tit-c3">2</span><span id="tit-c4">6</span></span>
    </div>
  </div>
  <script>
    // Construction mesurée sur Apple : le premier mot et le début du second à la coupe (37,62 s), la fin du
    // second à 37,95 s, le petit mot à 38,2 s, puis le grand mot caractère par caractère à partir de 38,4 s.
    // Ensuite le bloc recule lentement (720 puis 640 px de large de 38,75 à 39,75 s).
    const C = 37.62;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#tit-catalogue", { "--w": "360px" }, { "--w": "720px", duration: 0.33, ease: "power2.inOut" }, 0);
    tl.fromTo("#tit-edition", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power1.out" }, 38.2 - C);
    ["#tit-c1", "#tit-c2", "#tit-c3", "#tit-c4"].forEach((s, i) => {
      tl.fromTo(s, { opacity: 0, filter: "blur(10px) brightness(1.6)" },
        { opacity: 1, filter: "blur(0px) brightness(1)", duration: 0.14, ease: "power1.out" }, 38.4 - C + i * 0.07);
    });
    tl.fromTo("#tit-bloc", { scale: 1 }, { scale: 0.89, duration: 39.9 - 38.75, ease: "none", transformOrigin: "960px 500px" }, 38.75 - C);
    window.__timelines["titre"] = tl;
  </script>
