    // Le faisceau part du point où le packshot s'est posé (centre du cadre).
    const SOMMETS = [[1160, 0], [1920, 0], [1920, 230], [1130, 600], [930, 470]];
    const ORIGINE = [960, 540];
    const polygone = (k) =>
      "polygon(" + SOMMETS.map(([x, y]) =>
        `${ORIGINE[0] + (x - ORIGINE[0]) * k}px ${ORIGINE[1] + (y - ORIGINE[1]) * k}px`).join(", ") + ")";
