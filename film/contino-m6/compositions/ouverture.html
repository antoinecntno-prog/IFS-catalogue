  <script>
    // Progression du mouvement du produit, mesurée image par image sur le film Apple (0 à 1,58 s).
    const T = [0, 0.208, 0.375, 0.458, 0.542, 0.625, 0.708, 0.792, 0.875, 0.958, 1.042, 1.167, 1.333, 1.583];
    const P = [0, 0.007, 0.025, 0.045, 0.082, 0.147, 0.268, 0.615, 0.871, 0.973, 0.985, 0.995, 0.999, 1];
    // La rotation dans le plan démarre plus tard que le recul : angle du bord supérieur mesuré image par image.
    const TR = [0, 0.458, 0.542, 0.625, 0.708, 0.792, 0.875, 0.958, 1.042, 1.6];
    const PR = [0, 0, 0.04, 0.073, 0.1, 0.36, 0.78, 1, 1, 1];
    // Interpolation monotone (Fritsch-Carlson) : une fonction pure du temps, sans état.
    const courbe = (T, P) => {
      const n = T.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((P[i + 1] - P[i]) / (T[i + 1] - T[i]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
      m.push(d[n - 2]);
      for (let i = 0; i < n - 1; i++) {
        if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
        const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
        if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
      }
      return (t) => {
        if (t <= T[0]) return P[0];
        if (t >= T[n - 1]) return P[n - 1];
        let i = 0;
        while (t > T[i + 1]) i++;
        const h = T[i + 1] - T[i], u = (t - T[i]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * P[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * P[i + 1] + (u3 - u2) * h * m[i + 1];
      };
    };
    const progression = courbe(T, P);
    const rotationProgression = courbe(TR, PR);
    // Pose finale mesurée : rotation 47° dans le plan, inclinaison 60°, échelle 0,34, décalage (+10, +26) px.
    function poseProduit(t) {
      const p = progression(t), r = rotationProgression(t), e = 1 - 0.66 * p;
      gsap.set("#ouv-objet", { rotation: 47 * r });
      // Perspective divisée par l'échelle : même projection que l'objet réduit placé à 2400 px.
      gsap.set("#ouv-lacet", { rotationY: 0, transformPerspective: 2400 / e });
      gsap.set("#ouv-inclinaison", { rotationX: 60 * p });
      gsap.set("#ouv-echelle", { scale: e, x: 10 * p, y: 26 * p });
    }

    // Faisceau : polygone final mesuré à 2,38 s ; il naît près du produit et s'étend vers le haut à droite.
    const SOMMETS = [[1102, 0], [1920, 0], [1920, 190], [1290, 486], [1000, 640], [790, 428]];
    const ORIGINE = [1180, 470];
    const polygone = (k) =>
      "polygon(" + SOMMETS.map(([x, y]) =>
        `${ORIGINE[0] + (x - ORIGINE[0]) * k}px ${ORIGINE[1] + (y - ORIGINE[1]) * k}px`).join(", ") + ")";

    const tl = gsap.timeline({ paused: true });
    tl.addLabel("recul", 0).addLabel("emergence", 1.72).addLabel("faisceau", 1.85).addLabel("tenue", 2.38);

    const proxy = { t: 0 };
    tl.fromTo(proxy, { t: 0 }, { t: 1.6, duration: 1.6, ease: "none", onUpdate: () => poseProduit(proxy.t) }, "recul");
    // Lumière mesurée sur Apple : l'ordinateur passe de 130 à 61 de luminance moyenne en s'inclinant (0,70 à 0,88 s),
    // puis le capot qui se lève reprend la lumière.
    tl.fromTo("#ouv-echelle", { filter: "brightness(1)" }, { filter: "brightness(0.46)", duration: 0.18, ease: "power1.inOut" }, 0.7);
    tl.to("#ouv-echelle", { filter: "brightness(0.75)", duration: 0.28, ease: "power1.out" }, 1.75);
    // Le capot se lève vers la caméra autour de la charnière : 15° à 1,84 s, 35° à 1,92 s, 55° à 2,0 s, ouvert à 2,4 s.
    tl.fromTo("#ouv-charniere", { rotationX: 0, z: 13 }, { keyframes: [
      { rotationX: -15, duration: 0.11, ease: "power1.in" },
      { rotationX: -35, duration: 0.08, ease: "none" },
      { rotationX: -55, duration: 0.08, ease: "power1.out" },
      { rotationX: -95, duration: 0.4, ease: "sine.inOut" },
    ] }, 1.73);
    // Capot vu en biais : la perspective incline le texte du logo. On compense pendant l'ouverture pour qu'il
    // apparaisse droit, comme la pomme sur le portable d'Apple à 2,71 s.
    tl.fromTo("#ouv-monogramme", { skewY: 0 }, { skewY: -15, duration: 0.6, ease: "sine.inOut" }, 1.73);
    // Le faisceau s'ouvre de 1,85 à 2,30 s.
    tl.fromTo("#ouv-faisceau", { clipPath: polygone(0) }, { clipPath: polygone(1), duration: 0.45, ease: "sine.inOut" }, "faisceau");
    // Le titre sort du noir à 1,72 s et s'éclaire depuis le faisceau jusqu'à 2,2 s, puis rien ne bouge.
    tl.fromTo("#ouv-lumiere", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, "emergence");
    tl.fromTo("#ouv-lumiere", { "--r": "-350px" }, { "--r": "1900px", duration: 0.45, ease: "power1.in" }, "emergence+=0.03");

    poseProduit(0);
    window.__timelines["ouverture"] = tl;
  </script>
