  <script>
    const C = 33.4;
    const k = (ts) => ts.map((t) => t - C);
    // Masque en V relevé sur Apple de 33,5 à 36,25 s (outils-calage/formes.py).
    const M = window.MASQUES.fermeture;
    const V = calque.piste(k(M.T), M.P);
    // Pose de l'ordinateur calée sur les bornes du capot mesurées chez Apple (échelle corrigée de la
    // perspective, le capot étant plus près de l'objectif en vue de face) : échelle, inclinaison de la
    // caméra, angle du capot, bord charnière à l'écran. Le capot reste face caméra pendant qu'elle monte
    // au zénith, puis l'ordinateur fermé est seul, comme au tout début du film.
    const POSE = calque.piste(k([33.4, 34.5, 35.0, 35.25, 35.5, 35.75, 36.0, 36.25, 36.5, 37.0, 37.62]), [
      [0.584, 80, -119, 668],
      [0.585, 80, -119, 662],
      [0.59, 80, -107, 600],
      [0.616, 80, -108.7, 588],
      [0.629, 80, -98, 572],
      [0.656, 70, -70, 548],
      [0.783, 50, -50, 560],
      [0.895, 25, -25, 640],
      [0.953, 10, -10, 744],
      [1.04, 0, 0, 798],
      [1.04, 0, 0, 798],
    ]);
    const tl = gsap.timeline({ paused: true });
    calque.piloter(tl, 0, 4.22, (t) => {
      gsap.set("#fer-masque", { clipPath: calque.polygone(V(t)) });
      const [e, inc, cap, charniere] = POSE(t);
      const dy = charniere - (540 + e * 240 * Math.cos((inc * Math.PI) / 180));
      gsap.set("#fer-lacet", { transformPerspective: 2400 / e });
      gsap.set("#fer-inclinaison", { rotationX: inc });
      gsap.set("#fer-charniere", { rotationX: cap, z: 13 });
      gsap.set("#fer-echelle", { scale: e, x: 5, y: dy });
    });
    window.__timelines["fermeture"] = tl;
  </script>
