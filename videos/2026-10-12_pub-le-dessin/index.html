      @font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:400 700;font-display:block;src:url(fonts/hanken-grotesk-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

      :root {

        --jaune: #ffe45c;
        --encre: #1a1320;
        --blanc: #ffffff;
      }
      html, body { margin: 0; background: var(--blanc); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--blanc); }
      .plein { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
      .couche { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; left: 0; top: 0; }

      /* seuls les textes reçoivent les points de mesure : décors et calques transparents sont ignorés */
      #root * { pointer-events: none; }

  <body>
    <div id="root" data-composition-id="le-dessin" data-start="0" data-width="1080" data-height="1920" data-duration="22.5" data-fps="30">
      <!-- Scène 1 : la feuille de match sur une surface anthracite -->

      <!-- Scène 2 : le vestiaire du club -->

        <div id="s2-cam" class="cam">
          <div id="s2-mur" class="couche"><img id="s2-mur-img" src="assets/vestiaire-mur.jpg" alt="" /></div>
          <div id="s2-rangee" class="couche">

              <svg id="logo-svg" width="240" height="102" viewBox="0 0 240 102">

        </div>
        <!-- Accroche, version vestiaire : sous les sets, révélée avec la scène à travers le ballon -->
        <div id="ac-bas" class="accroche">
          <div id="acb-surligne" class="ac-surligne"></div>

          <div id="acb-l2" class="ligne principal"><span id="acb-l2-t"><span id="acb-prix">25,99&nbsp;€</span> HT dès 30 pièces</span></div>

      <!-- Carton 1 : l'étiquette de prix dessinée au feutre -->

        <svg id="etiq-fil" class="plein" viewBox="0 0 1080 1920" width="1080" height="1920"><path id="fil" d="" fill="none" stroke="#1a1320" stroke-width="3" stroke-linecap="round" /></svg>
        <div id="etiq-corps">
          <svg id="etiq-svg" class="abs" width="10" height="10"><path id="etiq-fond" d="" fill="#ffffff" /><path id="etiq-trait" d="" fill="none" stroke="#b3125f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle id="etiq-trou" r="12" fill="none" stroke="#b3125f" stroke-width="5" /></svg>
          <div id="surligne"></div>
          <div id="c1-l1" class="ligne principal"><span id="c1-l1-t"><span id="c1-prix">25,99&nbsp;€</span> HT dès 30 pièces</span></div>
          <div id="c1-l2" class="ligne secondaire"><span id="c1-l2-t">21,99&nbsp;€ HT à 500, transport inclus</span></div>
        </div>
      </div>

      <!-- Son : musique composée pour la grille de 128 BPM et bruitages calés sur le mouvement (outils/sound_design.py) -->
      <audio id="son-mix" src="assets/audio/mix.wav" data-start="0" data-duration="22.5" data-track-index="10" data-volume="1.1"></audio>

      <!-- Le ballon dessiné, fil rouge entre les scènes -->
      <div id="ballon-calque">
        <svg id="encre-svg" class="plein" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
        <div id="ball-ombre"></div>
        <svg id="ball-trail" class="plein" viewBox="0 0 1080 1920" width="1080" height="1920">
          <path id="trail-1" d="" fill="none" stroke="#b3125f" stroke-width="6" stroke-linecap="round" />
          <path id="trail-2" d="" fill="none" stroke="#b3125f" stroke-width="5" stroke-linecap="round" />
        </svg>
        <div id="ball">
          <div id="ball-body">
            <svg width="128" height="128" viewBox="-64 -64 128 128">
              <defs><clipPath id="ball-clip"><path id="ball-clip-d" d="" /></clipPath></defs>
              <path id="ball-fond" d="" fill="#ffffff" />
              <g id="ball-hachures" clip-path="url(#ball-clip)" stroke="#b3125f" stroke-width="3.5" stroke-linecap="round" opacity="0.55"></g>
              <g clip-path="url(#ball-clip)"><g id="ball-motif"></g></g>
              <path id="ball-trait" d="" fill="none" stroke="#b3125f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const D = window.DESSIN;
        const DEC = window.DECORS;
        const NS = "http://www.w3.org/2000/svg";
        const CX = 540, CY = 960;

        // Grille de poses : 128 BPM, un temps = 0,46875 s. À l'arrivée de la piste, ajuster TEMPS et OFFSET.
        const TEMPS = 60 / 128, OFFSET = 0;
        const BEATS = { b01_hook: 0, b02_hachures: 4, b03_contact: 8, b04_envol: 10, b05_vestiaire: 14, b06_tailles: 18, b07_rang: 22, b08_signature: 24, b09_prix: 28, b10_maquette: 34, b11_cta: 40, b12_page: 46, fin: 48 };
        const L = {};
        for (const [k, n] of Object.entries(BEATS)) L[k] = OFFSET + n * TEMPS;
        const TP = (n) => OFFSET + n * TEMPS;
        const DUREE = L.fin;

        const E = (n) => gsap.parseEase(n);
        const e2o = E("power2.out"), e2i = E("power2.in"), e2io = E("power2.inOut"), e1io = E("power1.inOut");
        const e3i = E("power3.in"), eso = E("sine.out"), esio = E("sine.inOut");
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const seg = (t, a, b) => clamp((t - a) / (b - a));
        const lerp = (a, b, u) => a + (b - a) * u;
        const lp = (p, q, u) => ({ x: lerp(p.x, q.x, u), y: lerp(p.y, q.y, u) });
        const herm = (p0, p1, m0, m1, u) => {
          const u2 = u * u, u3 = u2 * u;
          return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1;
        };
        const $ = (id) => document.getElementById(id);
        const el = (tag, attrs, parent) => {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        };
        // PRNG à graine fixe (mulberry32)
        const prng = (seed) => () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };

        // ---------------------------------------------------------------- caméras
        function camF(t) {
          let s = 1, r = 0, x = 0, y = 0;
          if (t < L.b02_hachures) {
            // push-in power2.out, précédé d'une prise de vitesse de 0,22 s : la caméra est immobile au raccord de boucle
            const v = seg(t, 0, L.b02_hachures), w = clamp(v / 0.12);
            const u = e2o(v) * (w * w * (3 - 2 * w));
            s = 1 + 0.1 * u; r = -2 + 2 * u; x = -40 * u;
          } else if (t < L.b03_contact) {
            const u = seg(t, L.b02_hachures, L.b03_contact);
            s = 1.1 + 0.06 * u; x = -40 - 70 * u;
          } else if (t < L.b04_envol) {
            const u = e2o(seg(t, L.b03_contact, L.b04_envol));
            s = 1.16 + 0.06 * u; x = -110;
            const tau = t - L.b03_contact;
            y = tau < 0.08 ? 8 * e2o(tau / 0.08) : 8 * (1 - eso(clamp((tau - 0.08) / 0.32)));
          } else if (t < L.b10_maquette) {
            s = 1.22; x = -110; y = 420 * e2io(seg(t, L.b04_envol, L.b04_envol + 1.4));
          } else if (t < L.b11_cta) {
            const u = e1io(seg(t, L.b10_maquette, L.b11_cta));
            s = 1 + 0.08 * u; x = -30 * u;
          } else if (t < L.b12_page) {
            s = 1.08; x = -30;
          } else {
            // retour à l'état de l'image 0, vitesse d'arrivée égale à celle du départ de b01
            const T12 = DUREE - L.b12_page, u = seg(t, L.b12_page, DUREE);
            s = herm(1.08, 1.0, 0, 0, u);
            r = herm(0, -2, 0, 0, u);
            x = herm(-30, 0, 0, 0, u);
          }
          return { s, r, x, y };
        }
        function camV(t) {
          let s = 1, x = 0;
          const t5 = L.b05_vestiaire, t7 = L.b07_rang, t8 = L.b08_signature, t9 = L.b09_prix, t10 = L.b10_maquette;
          if (t < t5) x = 0;
          else if (t < t7) x = (-260 * (t - t5)) / (t7 - t5);
          else if (t < t8) { const u = e2o(seg(t, t7, t8)); x = -260 - 32.5 * u; s = 1 + 0.04 * u; }
          else if (t < t9) { x = -292.5; s = 1.04 + 0.06 * seg(t, t8, t9); }
          else { const u = e2io(seg(t, t9, t10)); x = -292.5 + 80 * u; s = 1.1 - 0.28 * u; }
          return { s, r: 0, x, y: 0 };
        }
        function versEcran(p, cam, k) {
          const px = p.x + cam.x * k - CX, py = p.y + cam.y * k - CY;
          const a = (cam.r * Math.PI) / 180, c = Math.cos(a), sn = Math.sin(a);
          return { x: CX + (px * c - py * sn) * cam.s, y: CY + (px * sn + py * c) * cam.s };
        }

        // ---------------------------------------------------------------- géométrie du dessin
        const S_A = 0.64, S_B = 0.555;
        const SETC = { x: 323, y: 413.5 }; // centre du set dans la photo source
        const A0 = { x: 540 - SETC.x * S_A, y: 895 - SETC.y * S_A };
        const B0 = { x: 344.5 - SETC.x * S_B, y: 640 - SETC.y * S_B };
        const vers = (o, s) => (p) => ({ x: o.x + p.x * s, y: o.y + p.y * s });
        const versA = vers(A0, S_A), versB = vers(B0, S_B);

        function cheminCR(pts, ferme) {
          const n = pts.length, f = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);
          let d = "M" + f(pts[0]);
          const last = ferme ? n : n - 1;
          for (let i = 0; i < last; i++) {
            const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
            const q0 = ferme || i > 0 ? p0 : p1, q3 = ferme || i + 2 < n ? p3 : p2;
            const c1 = [p1[0] + (p2[0] - q0[0]) / 6, p1[1] + (p2[1] - q0[1]) / 6];

            const kPap = lerp(0.6, 1.4, bl), kCont = lerp(1.0, 1.4, bl);
            // papier à 0,6 et contenu à 1,0 ; toute la page passe à 1,4 quand elle tourne
            tr(pageB, cf.x * kPap, cf.y * kPap);
            tr($("pageB-contenu"), cf.x * (kCont - kPap), cf.y * (kCont - kPap));
            if (t >= L.b12_page) {
              const f = FOLD_FIN * e2i(seg(t, L.b12_page, L.b12_page + 0.84));
              const pl = pliage(f);
              $("pageB").style.clipPath = polyCss(pl.reste);
              const flap = $("flap");
              flap.style.transform = pl.m;
              flap.style.clipPath = polyCss(pl.plie);
              $("flap-ombre").style.visibility = pl.plie.length > 2 ? "inherit" : "hidden";
            } else {
              $("pageB").style.clipPath = "none";
              $("flap-ombre").style.visibility = "hidden";
            }
          } else $("flap-ombre").style.visibility = "hidden";

          // croquis B : passes de couleurs, coche, feutre B, reflet
          crB.groupes.forEach((g, j) => g.forEach((h, i) => {
            if (j === 0) { traceHachure(h, 1); return; }
            const d0 = PASS_B.t0 + (j - 1) * PASS_B.ecart + i * PASS_B.pas;
            traceHachure(h, seg(t, d0, d0 + PASS_B.duree));
          }));
          for (const k in crB.traits) trace(crB.traits[k], 1);
          const pc = seg(t, ...COCHE);
          coche.setAttribute("stroke-dashoffset", (COCHE_LEN * (1 - pc)).toFixed(2));
          coche.style.visibility = pc > 0 ? "inherit" : "hidden";
          placeFeutre($("feutreB"), feutreB(t), t, { x: 0, y: 0 });
          tr($("reflet"), -700 + 1700 * seg(t, L.b11_cta, L.b12_page), 0);

          // ---- scène vestiaire
          const cv = camV(t);
          elsT.s2cam.style.transform = `scale(${cv.s.toFixed(5)})`;
          COUCHES_V.forEach((c) => tr(c.n, cv.x * c.k, cv.y * c.k));
          sets.forEach((n, i) => {
            const st = etatSet(i, t);
            if (!st) { n.style.visibility = "hidden"; return; }
            n.style.visibility = "inherit";
            n.style.transform = `translate(${st.x.toFixed(2)}px, ${st.y.toFixed(2)}px) rotate(${st.rot.toFixed(3)}deg) scale(${st.sc.toFixed(4)}) translate(${(-PIV.x).toFixed(2)}px, ${(-PIV.y).toFixed(2)}px)`;
          });
          const pl = seg(t, ...ECRIT);
          logoTrace.setAttribute("stroke-dashoffset", (LOGO_LEN * (1 - pl)).toFixed(2));
          $("logo-boite").style.visibility = pl > 0 ? "inherit" : "hidden";

          // ---- ballon
          const b = ballon(t);
          const c = centreBallon(b);
          const ball = $("ball"), body = $("ball-body");
          ball.style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px) rotate(${(b.rot || 0).toFixed(2)}deg)`;
          const k = b.k, sx = b.sigma / k, sy = b.sigma * k;
          body.style.transform = `scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
          $("ball-motif").setAttribute("transform", `rotate(${angleMotif(t, b).toFixed(2)})`);
          const vide = b.vide || 0;
          $("ball-fond").setAttribute("fill-opacity", (1 - vide).toFixed(3));
          $("ball-hachures").setAttribute("opacity", (0.55 * (1 - clamp((b.sigma - 2) / 5))).toFixed(3));
          $("ball-motif").setAttribute("opacity", (1 - clamp((b.sigma - 2.6) / 5)).toFixed(3));
          ball.style.visibility = b.sigma > 23.5 ? "hidden" : "inherit";
          // ouverture du vestiaire à travers le ballon
          if (t >= 6.2125 && t < L.b05_vestiaire) {
            const ri = Math.max(0, (R - 3.5) * b.sigma * vide);
            elsT.s2.style.clipPath = `circle(${ri.toFixed(1)}px at ${c.x.toFixed(1)}px ${c.y.toFixed(1)}px)`;
          } else elsT.s2.style.clipPath = "none";
          // ombre
          const om2 = $("ball-ombre");
          if (b.f === "F" && b.sol) {
            const rx = (R * 1.05 * b.sigma) / (1 + b.h / 600), op = 0.22 / (1 + b.h / 250);
            om2.style.visibility = "inherit"; om2.style.opacity = op.toFixed(3);
            om2.style.transform = `translate(${(b.sol.x + 6 - rx).toFixed(1)}px, ${(b.sol.y + 2 - rx * 0.42).toFixed(1)}px) scale(${((2 * rx) / 200).toFixed(4)}, ${((0.84 * rx) / 200).toFixed(4)})`;
          } else if (b.ombreF) {
            const o = b.ombreF, rx = (R * 1.05 * o.s) / (1 + o.h / 600), op = 0.22 / (1 + o.h / 250);
            om2.style.visibility = "inherit"; om2.style.opacity = op.toFixed(3);
            om2.style.transform = `translate(${(o.sol.x + 6 - rx).toFixed(1)}px, ${(o.sol.y + 2 - rx * 0.42).toFixed(1)}px) scale(${((2 * rx) / 200).toFixed(4)}, ${((0.84 * rx) / 200).toFixed(4)})`;
          } else if (b.f === "V") {
            const rr = R * b.sigma;
            om2.style.visibility = "inherit"; om2.style.opacity = "0.13";
            om2.style.transform = `translate(${(c.x + 14 * b.sigma - rr).toFixed(1)}px, ${(c.y + 18 * b.sigma - rr).toFixed(1)}px) scale(${((2 * rr) / 200).toFixed(4)})`;
          } else om2.style.visibility = "hidden";
          // traînée : deux traits qui suivent avec 0,06 et 0,12 s de retard
          let c1 = centreBallon(ballon(Math.max(0, t - 0.06))), c2 = centreBallon(ballon(Math.max(0, t - 0.12)));
          const vit = Math.hypot(c.x - c1.x, c.y - c1.y) / 0.06;
          const memeScene = ballon(Math.max(0, t - 0.12)).f === b.f && b.f !== "ecran";
          const opT = memeScene ? clamp((vit - 350) / 900) : 0;
          const nrm = (p, q) => { const dx = q.x - p.x, dy = q.y - p.y, n = Math.hypot(dx, dy) || 1; return { x: -dy / n, y: dx / n }; };
          // traits de vitesse partant du bord arrière du ballon, décalés de part et d'autre de la trajectoire
          const n1 = nrm(c1, c), n2 = nrm(c2, c1), off = R * 0.42 * b.sigma, rr = R * 0.95 * b.sigma;
          const ar = (p, q) => { const dx = q.x - p.x, dy = q.y - p.y, n = Math.hypot(dx, dy) || 1; return { x: dx / n, y: dy / n }; };
          const d1 = ar(c1, c), d2 = ar(c2, c1);
          const pt = (p, d, nn, o, k) => `${(p.x - d.x * rr + nn.x * o * k).toFixed(1)},${(p.y - d.y * rr + nn.y * o * k).toFixed(1)}`;
          // longueur plafonnée à 1,4 rayon : la traînée reste collée au ballon
          const cap = (q, p) => { const dx = q.x - p.x, dy = q.y - p.y, n = Math.hypot(dx, dy), m = 1.4 * R * b.sigma; return n > m ? { x: p.x + (dx * m) / n, y: p.y + (dy * m) / n } : q; };
          c1 = cap(c1, c); c2 = cap(c2, c1);
          const l1 = $("trail-1"), l2 = $("trail-2");
          l1.setAttribute("d", `M${pt(c1, d1, n1, off, 1)} L${pt(c, d1, n1, off, 0.8)}`);
          l2.setAttribute("d", `M${pt(c2, d2, n2, -off, 1)} L${pt(c1, d2, n2, -off, 0.8)}`);
          l1.setAttribute("opacity", opT.toFixed(3)); l2.setAttribute("opacity", (opT * 0.7).toFixed(3));
          // points d'encre
          CONTACTS.forEach((ct, i) => {
            const vis = t >= ct.t && t < ct.t + 0.9 && ((ct.f === "F" && visF) || (ct.f === "V" && visV));
            POINTS[i].forEach((pt) => {
              if (!vis) { pt.n.setAttribute("opacity", 0); return; }
              const cam = cams[ct.f](t), q = versEcran({ x: ct.P.x + pt.dx, y: ct.P.y + pt.dy }, cam, coefs[ct.f]);
              const u = t - ct.t, sc = e2o(clamp(u / 0.07)) * cam.s;
              pt.n.setAttribute("cx", q.x.toFixed(1)); pt.n.setAttribute("cy", q.y.toFixed(1));
              pt.n.setAttribute("transform", `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${sc.toFixed(3)}) translate(${(-q.x).toFixed(1)} ${(-q.y).toFixed(1)})`);
              pt.n.setAttribute("opacity", (1 - seg(u, 0.35, 0.9)).toFixed(3));
            });
          });

          // ---- étiquette de prix (carton 1)
          rendEtiquette(t, cv);

          // ---- accroche
          rendAccroche(t, cf);
        }

        // ---------------------------------------------------------------- étiquette
        const ET = { x0: 60, x1: 1020, y0: 900, y1: 1150 };
        let etiqPret = false;
        function preparerEtiquette() {
          const w = ET.x1 - ET.x0, h = ET.y1 - ET.y0, pointe = 70;
          const svg = $("etiq-svg");
          svg.setAttribute("width", w + 20); svg.setAttribute("height", h + 20);
          svg.style.left = "-10px"; svg.style.top = "-10px";
          const d = `M${10 + 6},${10} L${10 + w - pointe},${10} L${10 + w},${10 + h / 2} L${10 + w - pointe},${10 + h} L${10 + 4},${10 + h - 2} Q${10 - 2},${10 + h / 2} ${10 + 6},${10}`;
          $("etiq-fond").setAttribute("d", d + "Z");
          const t2 = $("etiq-trait");
          t2.setAttribute("d", d);
          const len = t2.getTotalLength();
          t2.setAttribute("stroke-dasharray", len + " " + (len + 10));
          t2.dataset.len = len;
          $("etiq-trou").setAttribute("cx", 10 + w - pointe + 14); $("etiq-trou").setAttribute("cy", 10 + h / 2);
          const corps = $("etiq-corps");
          corps.style.left = ET.x0 + "px"; corps.style.top = ET.y0 + "px"; corps.style.width = w + "px"; corps.style.height = h + "px";
          etiqPret = true;
        }
        function rendEtiquette(t, cv) {
          const vis = t >= L.b09_prix && t < 15.85;
          $("etiquette").style.visibility = vis ? "inherit" : "hidden";
          if (!vis || !etiqPret) return;
          const t2 = $("etiq-trait"), len = +t2.dataset.len;
          const p = e2io(seg(t, L.b09_prix, 13.4));
          t2.setAttribute("stroke-dashoffset", (len * (1 - p)).toFixed(2));
          $("etiq-fond").setAttribute("fill-opacity", (0.96 * seg(t, 13.2, 13.4)).toFixed(3));
          $("etiq-trou").setAttribute("opacity", seg(t, 13.3, 13.4).toFixed(3));
          const sortie = 1 - seg(t, 15.6, 15.82);
          $("etiq-corps").style.opacity = sortie.toFixed(3);
          const sway = 1.2 * Math.exp(-(t - 13.4) / 0.9) * Math.sin((t - 13.4) * 5.2) * (t > 13.4 ? 1 : 0);
          $("etiq-corps").style.transform = `rotate(${sway.toFixed(3)}deg)`;
          // fil : du trou de l'étiquette à l'ourlet du set le plus proche
          const st = etatSet(7, t);
          const a = (pt) => {
            const ang = (st.rot * Math.PI) / 180, x = (pt.x - PIV.x) * st.sc, y = (pt.y - PIV.y) * st.sc;
            return versEcran({ x: st.x + x * Math.cos(ang) - y * Math.sin(ang), y: st.y + x * Math.sin(ang) + y * Math.cos(ang) }, cv, 0.7);
          };
          const haut = a({ x: 470, y: 440 });
          const trou = { x: ET.x1 - 70 + 14, y: (ET.y0 + ET.y1) / 2 };
          const mx = (haut.x + trou.x) / 2 + 20, my = Math.max(haut.y, trou.y) + 20;
          $("fil").setAttribute("d", `M${haut.x.toFixed(1)},${haut.y.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${trou.x.toFixed(1)},${trou.y.toFixed(1)}`);
          $("fil").setAttribute("opacity", (seg(t, 13.25, 13.4) * sortie).toFixed(3));
        }

        // ---------------------------------------------------------------- accroche, fonction pure de t
        // Version feuille : dans la caméra de la scène 1, qu'elle annule ; elle suit le papier pendant le
        // panoramique de b04, s'efface sous le vestiaire qui s'ouvre dans le ballon, et revient sous la page B :
        // le tour de page la découvre et l'image 0 la montre entière. Version vestiaire : sous les sets, sortie
        // quand l'étiquette commence son tracé (b09_prix).
        const AC_SORTIE = L.b09_prix;
        function rendAccroche(t, cf) {
          const haut = t < L.b05_vestiaire || t >= L.b12_page;
          $("ac-haut").style.visibility = haut ? "inherit" : "hidden";
          if (haut) {
            const s = +cf.s.toFixed(5), r = +cf.r.toFixed(3);
            const dy = t >= L.b04_envol && t < L.b05_vestiaire ? 0.6 * cf.y * s : 0;
            $("ac-haut").style.transform = `scale(${(1 / s).toFixed(6)}) rotate(${(-r).toFixed(3)}deg) translateY(${dy.toFixed(2)}px)`;
          }
          const bas = t < AC_SORTIE + 0.35;
          $("ac-bas").style.visibility = bas ? "inherit" : "hidden";
          if (bas) {
            for (const [id, at] of [["acb-l2", AC_SORTIE], ["acb-l1", AC_SORTIE + 0.08]]) {
              const q = e2i(seg(t, at, at + 0.25));
              $(id).style.clipPath = `inset(0% 0% ${(100 * q).toFixed(2)}% 0%)`;
              $(id + "-t").style.transform = `translateY(${(-40 * q).toFixed(2)}%)`;
            }
            $("acb-surligne").style.transform = `scaleX(${(1 - e2i(seg(t, AC_SORTIE, AC_SORTIE + 0.25))).toFixed(4)})`;
          }
        }

        // ---------------------------------------------------------------- textes : tailles, places, tweens éditoriaux
        function ajuste(id, base, max, min) {
          const n = $(id);
          n.parentNode.style.fontSize = base + "px";
          const w = n.offsetWidth;
          const taille = w > max ? Math.max(min, (base * max) / w) : base;
          n.parentNode.style.fontSize = taille.toFixed(1) + "px";
          return taille;
        }
        // place les deux lignes d'une accroche entre haut et bas (repère écran), marges de 65 px
        function placeAccroche(pre, base, haut, bas) {
          const f1 = ajuste(pre + "-l1-t", base, 950, 30), f2 = ajuste(pre + "-l2-t", base, 950, 30);
          const h1 = f1 * 1.05, h2 = f2 * 1.05, ecart = base > 60 ? 8 : 2;
          const y1 = haut !== null ? haut : bas - h2 - ecart - h1;
          const y2 = y1 + h1 + ecart;
          $(pre + "-l1").style.top = y1 + "px";
          $(pre + "-l2").style.top = y2 + "px";
          const prix = $(pre + "-prix"), sl = $(pre + "-surligne");
          sl.style.left = prix.offsetLeft - 10 + "px"; sl.style.top = y2 + f2 * 0.2 + "px";
          sl.style.width = prix.offsetWidth + 20 + "px"; sl.style.height = f2 * 0.78 + "px";
          // le surlignage se replie vers la droite à la sortie, comme sur l'étiquette
          sl.style.transformOrigin = "100% 50%";
        }
        function construire() {
          // carton 1, sur l'étiquette (repère écran)
          preparerEtiquette();
          const f1 = ajuste("c1-l1-t", 84, 840, 40), f2 = ajuste("c1-l2-t", 44, 840, 40);
          const w = ET.x1 - ET.x0;
          const l1 = $("c1-l1"), l2 = $("c1-l2");
          l1.style.width = l2.style.width = w - 70 + "px";
          l1.style.top = 34 + "px";
          l2.style.top = 34 + f1 * 1.05 + 22 + "px";
          // surlignage jaune du prix
          const prix = $("c1-prix");
          const sl = $("surligne");
          // offsetLeft se mesure depuis la ligne (parent positionné) : le centrage y est déjà compris
          const x0 = prix.offsetLeft;
          sl.style.left = x0 - 10 + "px"; sl.style.top = 34 + f1 * 0.2 + "px";
          sl.style.width = prix.offsetWidth + 20 + "px"; sl.style.height = f1 * 0.78 + "px";

          // accroche : deux lignes Archivo 900, la première en magenta, le prix surligné comme sur l'étiquette
          placeAccroche("ach", 72, 285, null);
          placeAccroche("acb", 44, null, 1246);

          // carton 2, sur la feuille B (repère monde, caméra autour de 1,04) ; la première ligne tient dans 880 px
          // pour garder 65 px de marge quand la caméra pousse à 1,08 pendant sa sortie
          const g1 = ajuste("c2-l1-t", 84 / 1.04, 880 / 1.04, 40 / 1.04), g2 = ajuste("c2-l2-t", 44 / 1.04, 900 / 1.04, 40 / 1.04);
          const m1 = $("c2-l1"), m2 = $("c2-l2");
          m1.style.left = m2.style.left = "20px";
          m1.style.top = 965 - g1 * 0.55 + "px";
          m2.style.top = 965 + g1 * 0.6 + 14 + "px";
          // bouton 720 x 140 et adresse, à l'écran avec la caméra fixe de b11 (échelle 1,08)
          const bt = $("bouton"), sc = 1.08;
          bt.style.width = 720 / sc + "px"; bt.style.height = 140 / sc + "px";
          bt.style.left = 570 - 360 / sc + "px"; bt.style.top = 1000 - 70 / sc + "px";
          bt.style.fontSize = 56 / sc + "px";
          const ad = $("adresse");
          ad.style.fontSize = 40 / sc + "px"; ad.style.left = "30px"; ad.style.top = 1000 + 70 / sc + 26 + "px";

          const tl = gsap.timeline({ paused: true });
          for (const [k, n] of Object.entries(BEATS)) tl.addLabel(k, OFFSET + n * TEMPS);
          // horloge : tout le mouvement physique et la caméra se calculent depuis t
          const horloge = { t: 0 };
          tl.to(horloge, { t: DUREE, duration: DUREE, ease: "none", onUpdate: () => rendu(horloge.t) }, 0);

          // set A : décollage de la feuille, puis sortie par le haut
          tl.fromTo("#setA-ombre", { opacity: 0 }, { opacity: 0.3, duration: 0.3, ease: "power2.out" }, "b03_contact+=0.15");
          tl.to("#setA-lift", { y: -80, scale: 1.06, duration: 0.6, ease: "power2.out" }, "b04_envol");
          tl.to("#setA-ombre", { scale: 1.1, opacity: 0.12, filter: "brightness(0) blur(14px)", duration: 0.6, ease: "power2.out" }, "b04_envol");
          tl.to("#setA-lift", { y: -2300, duration: 0.75, ease: "power2.in" }, "b04_envol+=0.6");
          tl.to("#setA-ombre", { opacity: 0, duration: 0.4, ease: "power2.in" }, "b04_envol+=0.6");

          // cartons : masque vertical 0,35 s power3.out, sortie par masque inverse 0,25 s power2.in
          const entre = (id, at) => {
            tl.fromTo("#" + id, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power3.out" }, at);
            tl.fromTo("#" + id + "-t", { yPercent: 60 }, { yPercent: 0, duration: 0.35, ease: "power3.out" }, at);
          };
          const sort = (id, at) => {
            tl.to("#" + id, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.25, ease: "power2.in" }, at);
            tl.to("#" + id + "-t", { yPercent: -40, duration: 0.25, ease: "power2.in" }, at);
          };
          entre("c1-l1", 13.4);
          tl.fromTo("#surligne", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 13.55);
          entre("c1-l2", 14.6);
          sort("c1-l2", 15.4); sort("c1-l1", 15.48);
          tl.to("#surligne", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power2.in" }, 15.48);
          entre("c2-l1", 16.4);
          entre("c2-l2", 17.8);
          sort("c2-l2", 18.38); sort("c2-l1", 18.46);
          // bouton : scale 0,97 vers 1 en 0,30 s power2.out avec masque, puis fixe ; adresse dessous
          tl.fromTo("#bouton", { scale: 0.97, clipPath: "inset(0% 0% 100% 0% round 5.6px)" }, { scale: 1, clipPath: "inset(0% 0% 0% 0% round 5.6px)", duration: 0.3, ease: "power2.out" }, "b11_cta");
          entre("adresse", L.b11_cta + 0.08);

          rendu(0);
          // repères exposés pour le sound design (outils/son.py) ; le rendu ne les lit pas
          window.__reperes = { feutreA, feutreB, ballon, centreBallon, contacts: CONTACTS, accroche: ACCROCHE, L, ST_A, H_A, PASS_B, COCHE, ECRIT, nbLignes: LIGNES.length, finFlamme: FIN_FLAMME };
          window.__timelines["le-dessin"] = tl;
        }
        document.fonts.ready.then(() => Promise.all([document.fonts.load('900 84px "Archivo"'), document.fonts.load('700 44px "Hanken Grotesk"')])).then(construire).catch((e) => console.error("construction", e && e.message, e && e.stack));
      })();
    </script>
  </body>
